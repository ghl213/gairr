; GAIRR system.ini —— 内置工具参数/规则/提示词覆盖（exe 同目录，改后重启生效）
; 业务配置（模型/项目/钩子）在 config.ini；本文件只管内置工具行为

[Tools]
; 扫描忽略目录/扩展名：逗号分隔，追加到内置默认（.git,node_modules,back,bin,obj 等）之后
ExtraIgnoreDirs=
ExtraIgnoreExts=
; Read 单次返回行数上限
ReadMaxLines=2000
; Read 单次结果字符预算（超出→保留头尾+分段重取提示）
ReadMaxChars=40000
; ListDir 条目上限
ListMaxItems=300
; Grep 命中上限
GrepMaxHits=50
; Glob 结果上限
GlobMaxItems=200
; Bash/Grep 返回字符上限
OutputMaxChars=6000
; 对话区工具卡内容预览字符上限
CardMaxChars=600
; Grep/Glob 正则超时秒数
RegexTimeoutSec=3
; qwen3 系思考模式开关：1=保留思维链（默认），0=关闭思考，content 直接输出（配合 prompts/agent-deep.md 中文说明规则）
EnableThinking=1
; Edit 成功后结果附行级 diff（工具卡红绿渲染+回喂模型自审）；0=关闭（错误定位增强不受此开关影响）
EditDiff=1
; Bash 危险命令拦截模式（逗号分隔）。留空=内置默认（del/rd/rmdir/format/git push/shutdown）；
; 填写则完全覆盖——清空拦截风险自担；Bash/插件/Hooks 均受该审查拦截。
DangerPatterns=

[Agent]
; Agent 工作模式：agile=敏捷模式（默认，语义直达+够用即停），deep=严谨模式（四层检索+完整验证）
AgentMode=agile
; 待办清单最小步数：1=简单任务允许单步计划（省轮次/token）；调高则强制更细拆分
PlanMinSteps=1
; 意图宣布兜底自定义关键词：模型只说话没调用工具时触发追发执行指令。逗号分隔正则片段，留空=用内置默认
; 例：IntentRetryKeywords=现在建清单.*继续改，下一步.*读取，接下来.*修改
IntentRetryKeywords=

[ToolDesc]
; 覆盖发给模型的工具 description（提示词层调优，留空用内置文案）
; 例：Bash=在 cmd 下执行命令。涉及删除的命令一律先问用户。
Map=
Read=
ListDir=
Bash=
Write=
Edit=
Grep=
Glob=
LoadSkill=
MapAuto=
MapTrace=
MapSlice=

[Verify]
; Write/Edit 写入代码文件后自动构建验证，结果回喂 Agent（构建失败模型下一轮直接修复）
AutoVerify=1
; 构建命令覆盖；留空=自动探测项目根 *.sln/*.csproj 并执行 dotnet build
; 例：dotnet build -c Release
BuildCmd=
; 验证命令超时（秒）
VerifyTimeoutSec=180
; 验证输出回喂字符上限
VerifyMaxChars=1500
; 连续构建失败上限：超限暂停自动验证并强提示模型停手排查（防同一错误反复重试耗满轮次），0=不限
MaxRepairRounds=3
; 增量验证：改动文件位于测试工程（*.Tests/）时自动跑 dotnet test，否则走构建；0=关闭
AutoTest=1

[Guard]
; 写前护栏：Write 覆盖已有文件前，要求本会话先用 Read 读取过目标（防未读直接覆盖丢代码）；0=关闭
FirstReadCheck=1

[Sensitive]
; 敏感信息加密（Core/SensitiveGuard.cs）：发往大模型前对密钥/密码/敏感URL 做可逆加密脱敏（ENC 令牌，AES-256-GCM），模型返回后再解密交工具执行/展示
; 加密密钥自动生成保存在 exe 同目录 sensitive.key（丢失则旧 ENC 令牌不可解，本地历史明文不受影响）
; Enabled：总开关 1=开启 0=关闭（默认关闭，避免影响本地模型与既有行为）；Keys/Passwords/Urls：各类别独立开关 1=掩码 0=跳过
Enabled=0
Keys=1
Passwords=1
Urls=1

[ProjectMap]
; 项目地图自动化（启动/切项目后后台执行）：生成地图、调用图谱、补注释、架构文档
; 另有内置工具 MapAuto 可在左侧栏禁用/启用——禁用后 Agent 不可见且自动触发一并停止
; AutoNotes=1 时缺注释文件/方法由大模型补说明（写 .gairr/notes.json，不改源码）
AutoNotes=1
; SymbolNotes=1 时符号索引中无中文注释的符号由 LLM 补说明（写 .gairr/symbol-notes.json，检索中文标签层受益，不改源码）
SymbolNotes=1
; 符号级补注单轮上限：0=不限（建议先设 30 小批验证质量，满意后改 0 全量）
SymbolNotesBatch=0
; 首次自动生成架构/功能文档（.gairr/docs/），之后结构大变化时提示重建
AutoDocs=1
; AiScan=1 时扫描前由 LLM 判断"非源码/非资源/非配置"目录与文件（写 .gairr/ai-ignore.json）；结构哈希不变不重判（省 token）
AiScan=1
; AiScan 候选池上限：超过时按目录采样（大项目防 prompt 爆炸；最小 100）
AiScanMaxFiles=2000
; 补注释批大小（批间 500ms 节流，防触发限流）
NotesBatch=3
; 任务结束后主动分词关联（后台异步调模型写 .gairr/tag-refs.jsonl，不阻塞对话；0=关闭）
EnrichTagRefs=1
; 本地向量检索（ONNX embedding，MapAuto 自动建 .gairr/embed-index.json，SmartSearch 第四层；0=关闭）
Embed=1

[LSP]
; 语言服务器（FindRefs 编译器级引用检索的后端）：
; 留空=自动探测：%USERPROFILE%\.dotnet\tools（dotnet tool install -g Microsoft.CodeAnalysis.LanguageServer）→ PATH
; 也可填显式路径，如：D:\tools\dotnet-language-server.exe
ServerPath=
; server 运行时的 DOTNET_ROOT（server 可能要求比 GAIRR 更新的 .NET 运行时）；留空=继承当前环境
; 例：%USERPROFILE%\.dotnet10（dotnet-install 安装的 .NET 10 SDK 目录）
DotnetRoot=
; 单次引用查询超时（秒）
RequestTimeoutSec=20
; 空闲回收（分钟）：超过未使用则杀进程释放内存，下次调用自动重启
IdleRecycleMin=20

[LspJava]
; Java 语言服务器（jdtls，FindRefs 对 .java 文件生效）：
; JdkPath：JDK 根目录（含 bin\javac.exe），如 D:\java\jdk-21；留空=自动探测 JAVA_HOME → lsp\java\ 自带 → PATH
; 注意：jdtls 最新版要求 JDK 21+，GAIRR 自动下载版自带 Temurin JDK21 到 lsp\java\（一次性 ~190MB）
JdkPath=
; JdtlsPath：jdtls 解压根目录（含 plugins\）；留空=自动（lsp\jdtls\ → 缺失则自动下载 ~180MB）
JdtlsPath=
; 缺失自动下载到 GAIRR 目录 lsp\ 下；0=只提示不下载
AutoDownload=1

[LspVue]
; Vue/TypeScript 语言服务器（volar，FindRefs 对 .vue/.ts/.js 生效）：
; NodePath：node.exe 路径；留空=自动探测 PATH → lsp\node\ 自带
NodePath=
; VolarPath：vue-language-server.js 路径；留空=自动（lsp\volar\ → 缺失则 npm 安装，用国内镜像源）
VolarPath=
; 缺失自动下载/安装；0=只提示不下载
AutoDownload=1

[Runtime]
; 插件/技能运行时节（plugin.ini 的 Command 与 SKILL.md 里的 {python}/{node}/{java} 占位符，见 Core/RuntimeEnv.cs）：
; 解释器缺失时自动下载便携版到 GAIRR 目录 envs\ 下：python=官方 embeddable 3.12（~11MB，无 pip）、
; node=官方 LTS v20（~30MB）、java=Temurin JRE21（~55MB，够跑 jar）；系统 PATH 已有解释器则不动；0=一律不下载（缺了由命令自行报错）
AutoDownload=1

[Notify]
; 挂起等人工（危险确认/计划审批）的钉钉提醒时机（后台/切走会话，见 Core/IdleGate.cs）：
; 短静默秒数 = 非视口会话挂起后、切出视口持续满该时长仍挂起即发一条钉钉提醒（默认 60；
; 用户在其它会话忙碌同样补发、切回视口清零再切走重新计时）；人不在的兜底沿用 IdleGate
; 3 分钟无操作阈值（SilentThreshold），无需在此配置
ShortSilentSec=60

[Server]
; 服务模式（gairr-cli / gairr-agent-server 无界面宿主）专属；图形界面忽略本节
; 危险命令策略：Ask=挂起等外部决策（默认，经 POST /decisions 回答）/ Allow=自动放行 / Deny=一律拒绝
DangerPolicy=Ask
; 会话存储根目录；留空=各项目 .gairr/sessions；共享盘/多用户场景可填全局目录
SessionDir=
