; NewsDigest 插件私有配置
; 只存本地，不随程序分发
[LLM]
; 多模型通道：按 Model1→Model2→... 顺序尝试；某模型超时/失败自动重试并切换下一通道；
; 所有通道都失败才走本地原文列表兜底。格式：Provider|BaseUrl|ApiKey|Model（OpenAI 兼容）。
; 注意：单模型超时 60s ×（1+重试1次）× 通道数 之和须小于 plugin.ini 的 Timeout=300s。
Model1=Kimi|https://api.kimi.com/coding/v1|sk-YOUR_API_KEY|kimi-for-coding
Model2=Bailian|https://token-plan.cn-beijing.maas.aliyuncs.com/compatible-mode/v1|sk-YOUR_API_KEY|qwen3.8-max

[Sources]
; 启用的数据源，逗号分隔；可选：hackernews, reddit, github
Sources=hackernews,github
TopN=10

; GitHub 搜索 API 令牌，未配置时可能触发速率限制
GitHubToken=

[Hooks]
DingTalkWebhook=
DingTalkSecret=
