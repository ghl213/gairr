[Stats]
Enabled=1 ; 匿名使用统计总开关（0=关闭：本地仍按天计时落盘，但不联网上报）
ServerUrl=http://127.0.0.1:8300 ; 统计服务器（gairr-stats-server）：启动时上报匿名设备ID+已封存日累计时长并做版本检查；失败不阻塞启动。公网部署后改为 https://你的服务器:端口
