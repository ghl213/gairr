; GAIRR 配置文件（UTF-8）—— Key 只存本地，不随程序分发
; 程序读取位置：exe 同目录

[LLM]
AutoTaskProvider=DeepSeek
Provider=web:deepseek ; 当前使用的供应商：Bailian / Kimi / Local
LastProvider=web:deepseek
LastModel=deepseek-专家
ThinkingMode=1 ; 大模型思考模式总开关（标题栏"思考"按钮持久化，0=关闭，1=开启；对 qwen3 系模型生效；百炼走顶层 enable_thinking，本地 llama.cpp 走 chat_template_kwargs）

[Bailian]
BaseUrl=https://token-plan.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
ApiKey=
Model=qwen3.8-max
MaxTokens=; 百炼模型支持长上下文，裁剪阈值放宽

[Kimi]
BaseUrl=https://api.kimi.com/coding/v1
ApiKey=
Model=kimi-for-coding
MaxTokens=; kimi-for-coding 支持 256K 上下文，裁剪阈值放宽（估算值，非 API 参数）

[Local]
BaseUrl=http://192.168.0.168:8084/v1 ; Ollama 端点；LM Studio 用 http://192.168.0.168:8084/v1
ApiKey=
Model=Qwen3.8-27B-UDQ4KXL
MaxTokens=; 本地模型上下文裁剪阈值
CompressSoftPct=40 ; 本地二套压缩参数：本地推理慢/显存紧，更早启动裁剪（全局默认50）
ResultBudget=3000 ; 本地二套压缩参数：旧轮读取结果降级预算收紧（全局默认4000）
LlmCompress=0 ; LLM压缩兜底用当前模型，本地推理太慢，关闭走确定性裁剪
EssentialFiles=0 ; P6压缩前必用文件询问本地关闭：本地推理慢，关闭后压缩退回纯确定性行为（全局默认1）
MonitorUrl=http://192.168.0.168/api/system.php ; 本地模型监控端点（标题栏 GPU 三色柱：显存/利用率/温度，15 秒刷新；空=不显示）
; 思考模式已统一由 [LLM] ThinkingMode + 标题栏"思考"开关控制，原 [Local] EnableThinking 废弃

[Providers]             ; 标题栏厂商清单（格式：显示名|key，逗号分隔，首项为默认）
List=百炼|Bailian, Kimi|Kimi, DeepSeek|DeepSeek, OpenAI|OpenAI, Claude|Claude, Gemini|Gemini, MiniMax|MiniMax, 智谱|Zhipu, 本地|Local

[Models]                ; 标题栏下拉候选清单（逗号分隔，首项为默认）
Bailian=qwen3.8-max, deepseek-v4-flash-0731
Kimi=kimi-for-coding
DeepSeek=deepseek-v4-flash
OpenAI=gpt-5.6-sol
Claude=claude-4-sonnet
Gemini=gemini-3.6-flash
MiniMax=minimax-m3
Zhipu=glm-5.3
Local=Qwen3.8-27B-UDQ4KXL

[WebChannels]               ; 网页模型通道：用独立内嵌网页窗口驱动真实站点（无需 ApiKey，登录态由窗口自身持久化）
; 格式：显示名|适配器|网址（适配器对应 WebModel/adapters/<适配器>.js；下多项用逗号分隔）
List=deepseek-专家|deepseek|https://chat.deepseek.com/, kimi-K3|kimi|https://www.kimi.com/agent?chat_enter_method=change_model
DeepThink=1                 ; 通道默认开启站点"深度思考"开关（0=关）
Search=1                    ; 通道默认开启站点"联网搜索"开关（0=关）
AutoRepair=1                ; 网页版自动修复侧车（0=关）：适配脚本报错/超时时旁路自动采样页面 DOM，调非网页模型
                            ; 生成补丁并应用到 WebModel/adapters/<适配器>.js（冷却10分/每日3次，补丁30分钟内仍报错
                            ; 自动回滚并暂停；补丁归档 data/webmodel/heal/<适配器>/ 可审查）

[ModelThinking]             ; 思考参数规则（一行一模型，未列出的模型不发思考参数，行为同原 qwen3 硬编码）
; 格式：模型名=参数名=on:开时值[,off:关时值][@写入路径][|levels=档位1,档位2]
; 值语法：true/false→布尔；{...}→JSON 对象；其他→字符串。@路径=写入嵌套位置（点号分隔），缺省=顶层
qwen3.8-max=enable_thinking=on:true,off:false
Qwen3.8-27B-UDQ4KXL=enable_thinking=on:true,off:false@chat_template_kwargs
k3=reasoning_effort=on:high|levels=low,high,max
kimi-for-coding=thinking=on:{"type":"enabled"}
deepseek-v4-pro=reasoning_effort=on:high|levels=low,high,max
deepseek-v4-flash=reasoning_effort=on:high|levels=low,high,max
deepseek-v4-flash-0731=reasoning_effort=on:high|levels=low,high,max
deepseek-chat=thinking=on:{"type":"enabled"}
gpt-5.6-sol=reasoning_effort=on:high|levels=low,medium,high
o3-mini=reasoning_effort=on:high|levels=low,medium,high
o4-mini=reasoning_effort=on:high|levels=low,medium,high
o1=reasoning_effort=on:high|levels=low,medium,high
claude-4-sonnet=thinking=on:{"type":"adaptive"}
claude-4-opus=thinking=on:{"type":"adaptive"}
claude-3-7-sonnet=thinking=on:{"type":"enabled","budget_tokens":4096}
gemini-3.1-pro=thinking_level=on:high|levels=low,medium,high
gemini-2.5-pro=thinking_level=on:high|levels=minimal,low,medium,high
gemini-3.6-flash=thinking_level=on:medium|levels=minimal,low,medium,high
minimax-m3=thinking=on:{"type":"adaptive"}
minimax-m2.7=thinking=on:{"type":"adaptive"}
glm-5.3=reasoning_effort=on:max|levels=low,high,max
glm-5.2=reasoning_effort=on:high|levels=low,high,max
glm-4.5=enable_thinking=on:true,off:false


[DeepSeek]              ; 示例：新增厂商只需加一节并在 [Providers] 中追加
BaseUrl=https://api.deepseek.com/v1
ApiKey=
Model=deepseek-v4-flash
MaxTokens=

