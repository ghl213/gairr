MaxTokens=

[Hooks]
TestScript= ; 任务成功后自动执行的测试脚本（目标7）
RunScript= ; 任务结束（不论成败）自动执行；占位符 {task} {status} {rounds} {tokens}
AutoDingTalk=0 ; 任务结束钉钉（旧目标6）已收敛停用：通知仅保留"人工介入点"——危险确认/计划审批挂起（视口弹卡/切走短静默/人不在兜底，见 [Notify] ShortSilentSec）；需无人值守任务结束汇报的宿主可自行改回 1
; DingTalk 配置已迁移到插件目录：app/GAIRR/plugins/dingtalk/config.ini
; 保留 AutoDingTalk 作为总开关；插件私有配置不再写入此处，避免敏感信息随主配置泄露。
DingTalkWebhook=
DingTalkSecret=

[Skills]
Dir=skills ; 技能目录（相对 exe 目录）；每技能一个子目录 SKILL.md 或平铺 .md
Disabled=pdf,ssh-skill

[Plugins]
Dir=plugins ; 声明式插件目录；每插件一个 ini（Name/Description/Command/ArgN）

[Market]
Sources=market\catalog.json ; 市场目录册源（逗号分隔，支持 http URL 或本地 json 路径；相对路径按 exe 目录解析）
GiteeToken=; Gitee 个人访问令牌：匿名已被限制，配置后市场在线搜索才包含 Gitee 源（设置→私人令牌 生成，勾 projects 权限即可）

[Git]
Enabled=1 ; git 全量管理总开关：启动自动探测/安装 git 并确保 ProjectRoot 已 init
AutoCommit=1 ; 任务结束自动 add -A + commit（消息含轮数/tokens/任务摘要）
IgnoreExtra= ; 初始化 .gitignore 时追加的忽略项（逗号分隔）

[CodeStyle]
MaxFileLines=300 ; 单文件行数上限（目标3）
MaxFuncLines=50 ; 单函数行数上限

[Agent]
ProjectRoot=D:\work\GairrAgent ; 当前工作项目根目录
MaxRounds=1000 ; Agent 最大循环轮次
CommandTimeout=180 ; Bash 默认超时秒数
MaxTokens=; 全局上下文裁剪阈值（估算值，非 API 参数）；供应商节 MaxTokens 可覆盖
; 压缩参数（CompressSoftPct/CompressHardPct/ResultBudget/BudgetKeepRounds/KeepRecentRounds/TopicOverlapKeepPct/LlmCompress）
; 为本地/网络两套配置的全局默认值：供应商节（如 [Local]）写同名键即覆盖，留空=用此值
ResultBudget=4000 ; 旧轮读取结果降级后的保留字符上限（保留头尾+重取提示，0=关闭）
BudgetKeepRounds=5 ; 最近 N 轮读取结果不降级（Edit 需从最新 Read 逐字抄 old_text；与 KeepRecentRounds 对齐）
CompressSoftPct=50 ; 压力驱动压缩软阈值（%）：估算 token 超过 MaxTokens×此比例才启动轮次剔除与读取降级，窗口富余时不擦除上下文
EssentialFiles=1 ; P6压缩前必用文件询问（%开关）：软阈值触发后先问 LLM"文件清单上哪些文件对剩余工作必须用"，必用文件豁免压缩②③④（非必用文件可更激进降级）；失败/超时自动回退确定性压缩，本地慢模型可设 0 关闭
QuotaWarnRequests=300 ; 每5小时窗口请求数预警阈值（Kimi 额度保护）

[Script]
PythonPath=python ; 可配 py -3 或 venv 路径
NodePath=node

[Database]
Type= ; H2 / MySQL 等（见开发方案 11.14）
Url=
User=
Pass=
AllowWrite=0 ; 默认只读

[Projects]
List=GAIRR|d:\work\gairr,GSFX|d:\work\gsfx,闪动洗车|D:\闪动洗车,GairrAgent|D:\work\GairrAgent

[ErrorCodes]
; 格式：状态码:关键词=提示信息（关键词逗号分隔；空关键词=匹配该状态码所有情况）
400:exceeds limit,exceeded model token limit=
400:reasoning_content is missing=请求参数错误：thinking 模式配置异常，请检查 [ModelThinking] 配置
400:unsupported image url,invalid_url=请求参数错误：图片 URL 格式不支持或无效
400:duplicated,function name=请求参数错误：工具定义中存在重复的函数名
400:high risk,rejected=请求被拒绝：内容被判定为高风险，请调整提问方式
401:invalid,expired,authentication=API 密钥无效：密钥可能已过期，请检查 config.ini 中的 ApiKey
401:subscription,plan,access to=权限不足：当前订阅计划不支持该模型，请在 config.ini 中切换可用模型
401:model id,does not exist=模型不可用：模型 ID 不存在或无权限访问，请检查 Model 配置
402:=会员权益异常：无法验证会员权益，请检查账号状态
403:usage limit,terminated=额度已用完：当前计费周期额度已耗尽，请等待重置或升级套餐
403:security risk,url=访问被拒绝：当前 URL 被判定存在安全风险
404:not found,permission denied=模型不存在：请检查 config.ini 中的 Model 配置是否正确
404:method not found=接口不存在：调用了不存在的 API 方法，请更新 GAIRR 版本
429:overloaded=服务过载：模型引擎当前负载过高，请稍后再试
429:too many requests=请求过于频繁：请降低调用频率后重试
429:usage limit,monthly=额度已用完：当前周期用量已达上限，请等待重置
499:context canceled=请求取消：工具调用过程中请求被中断，请重试
500:database,membership,account=服务端异常：会员系统故障，请稍后再试
500:timeout,closed,connection=服务端异常：网络连接超时，请检查网络后重试
500:rate limit script=服务端异常：限流系统故障，请稍后再试
500:bot_id,id_kinds=服务端异常：内部参数错误，请联系支持
500:url2text,spider,invalid html,moderation=工具调用失败：网页解析或内容审核出错，请检查 URL 有效性

