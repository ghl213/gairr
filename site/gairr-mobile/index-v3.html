<html lang="zh-CN">
<head>

    <!-- Twitter 卡片 -->
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="GAIRR Mobile">
    <meta name="twitter:description" content="GAIRR 手机端智能助手">

    <title>GAIRR Mobile</title>
    <style>
        html { height: 100%; overflow: hidden; background: #16213e; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #16213e; color: #eee; height: 100%; display: flex; flex-direction: column;
            overflow: hidden; position: fixed; top: 0; left: 0; right: 0; bottom: 0; width: 100%;
            overscroll-behavior-x: none; overscroll-behavior-y: none; touch-action: pan-y;
        }
        .header {
            position: fixed; top: 0; left: 0; right: 0; z-index: 50;
            padding: 12px 16px;
            padding-top: calc(4px + env(safe-area-inset-top, 0px));
            background: #16213e; border-bottom: 1px solid #0f3460;
            color: #eee;
            display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;
        }
        .header h1 { font-size: 18px; color: #e94560; cursor: pointer; }
        .header-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
        .status { display: flex; align-items: center; gap: 6px; font-size: 12px; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #666; }
        .status-dot.connected { background: #00d9ff; box-shadow: 0 0 8px #00d9ff; }
        .status-dot.connecting { background: #ffd700; animation: pulse 1s infinite; }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
        .config-btn { 
            background: none; border: none; color: #e94560; 
            padding: 4px; font-size: 14px; cursor: pointer;
            width: 32px; height: 36px; display: flex; align-items: center; justify-content: center;
        }
        .theme-btn {
            background: none; border: none; color: #e94560;
            padding: 4px; cursor: pointer;
            width: 32px; height: 36px; display: flex; align-items: center; justify-content: center;
        }
        .add-btn {
            background: none; border: none; color: #e94560;
            font-size: 24px; font-weight: bold; line-height: 1; cursor: pointer;
            width: 32px; height: 36px; display: flex; align-items: center; justify-content: center;
        }
        body.light-theme .add-btn { color: #e94560; }
        /* 浅色主题 */
        body.light-theme {
            background: #f5f5f5; color: #333;
        }
        body.light-theme .chat-container { background: #f5f5f5; }
        body.light-theme .message.assistant {
            background: #fff; border-color: #ddd; color: #333;
        }
        body.light-theme .message.user {
            background: #ffd6d6; color: #8c3030;
        }
        body.light-theme .bottom-bar {
            background: #fff; border-top-color: #ddd;
        }
        body.light-theme .status-bar {
            color: #666; border-bottom-color: #ddd;
        }
        body.light-theme .input-area input {
            background: #f5f5f5; border-color: #ddd; color: #333;
        }
        body.light-theme .config-content {
            background: #fff; color: #333;
        }
        body.light-theme .config-row input {
            background: #f5f5f5; border-color: #ddd; color: #333;
        }
        /* 会话列表浅色适配 */
        body.light-theme .session-content { background: #fff; }
        body.light-theme .session-item { border-color: #ddd; }
        body.light-theme .session-item:hover { background: #f0f6fd; }
        body.light-theme .session-id { color: #333; }
        body.light-theme .session-status { color: #777; }
        body.light-theme .seg button { background: #e9ecef; color: #555; }
        body.light-theme .seg button.on { background: #e94560; color: #fff; }
        body.light-theme .icon-close { background: #e9ecef; color: #666; }
        body.light-theme .close-btn { background: #e9ecef; color: #333; }
        body.light-theme .session-badge.live { color: #0072b5; }
        body.light-theme .group-title { color: #777; }
        body.light-theme .session-time { color: #888; }
        body.light-theme .history-hint { color: #666; }
        /* 危险命令确认卡片（SecurityAlert 事件展示；Confirm 级带允许/取消按钮调 /decisions） */
        .danger-card { margin-bottom: 12px; padding: 12px 14px; border-radius: 12px; background: #2d1b1b; border: 1px solid #e94560; max-width: 100%; }
        .danger-card .danger-title { color: #e94560; font-weight: bold; font-size: 14px; margin-bottom: 8px; }
        .danger-card .danger-cmd { font-family: monospace; font-size: 12px; background: #1a1a2e; padding: 8px; border-radius: 6px; word-break: break-all; white-space: pre-wrap; margin-bottom: 8px; }
        .danger-card .danger-meta { font-size: 12px; color: #999; margin-bottom: 4px; word-break: break-all; }
        .danger-card .danger-intent { font-size: 12px; color: #ccc; margin-bottom: 4px; }
        .danger-card .danger-btns { display: flex; gap: 10px; margin-top: 10px; }
        .danger-card .danger-btns button { flex: 1; padding: 10px 0; border: none; border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer; }
        .danger-card .btn-allow { background: #27ae60; color: #fff; }
        .danger-card .btn-deny { background: #555; color: #fff; }
        .danger-card .danger-done { font-size: 13px; font-weight: bold; margin-top: 10px; padding: 8px; border-radius: 8px; text-align: center; flex: 1; }
        .danger-card .danger-done.allowed { background: #1e3d2a; color: #2ecc71; }
        .danger-card .danger-done.denied { background: #3d2a2a; color: #e74c3c; }
        .danger-card .danger-done.pending { background: #3a3a2a; color: #ffd700; }
        body.light-theme .danger-card { background: #fff0f0; }
        body.light-theme .danger-card .danger-cmd { background: #f5f5f5; color: #333; }
        body.light-theme .danger-card .danger-meta { color: #777; }
        body.light-theme .danger-card .danger-intent { color: #555; }
        /* 方案确认卡片（PlanConfirm 事件：桌面弹方案框等待决策；按钮 POST /gui-decisions 回写） */
        .plan-card { margin-bottom: 12px; padding: 12px 14px; border-radius: 12px; background: #1b2438; border: 1px solid #4a7abf; max-width: 100%; }
        .plan-card .plan-title { color: #6fb3ff; font-weight: bold; font-size: 14px; margin-bottom: 8px; }
        .plan-card .plan-name { font-size: 14px; font-weight: bold; color: #eee; margin-bottom: 4px; word-break: break-all; }
        .plan-card .plan-meta { font-size: 12px; color: #999; margin-bottom: 4px; word-break: break-all; }
        .plan-card .plan-goal { font-size: 12px; color: #ccc; margin-bottom: 4px; white-space: pre-wrap; word-break: break-all; }
        .plan-card .plan-btns { display: flex; gap: 10px; margin-top: 10px; }
        .plan-card .plan-btns button { flex: 1; padding: 10px 0; border: none; border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer; }
        .plan-card .btn-approve { background: #27ae60; color: #fff; }
        .plan-card .btn-reject { background: #555; color: #fff; }
        .plan-card .plan-done { font-size: 13px; font-weight: bold; margin-top: 10px; padding: 8px; border-radius: 8px; text-align: center; flex: 1; }
        .plan-card .plan-done.allowed { background: #1e3d2a; color: #2ecc71; }
        .plan-card .plan-done.denied { background: #3d2a2a; color: #e74c3c; }
        .plan-card .plan-done.pending { background: #3a3a2a; color: #ffd700; }
        body.light-theme .plan-card { background: #eef4fd; border-color: #7aa7dd; }
        body.light-theme .plan-card .plan-meta { color: #777; }
        body.light-theme .plan-card .plan-goal { color: #555; }
        .chat-container { flex: 1; overflow-y: auto; padding: 16px; padding-top: calc(52px + env(safe-area-inset-top, 0px)); padding-bottom: calc(100px + env(safe-area-inset-bottom, 0px)); -webkit-overflow-scrolling: touch; }
        .message { margin-bottom: 12px; padding: 10px 14px; border-radius: 12px; max-width: 100%; word-wrap: break-word; white-space: pre-wrap; font-size: 14px; line-height: 1.5; }
        .message.user { background: #e94560; margin-left: auto; }
        .message.assistant { background: #16213e; border: 1px solid #0f3460; }
        /* 第 N 轮思考卡片（Round 事件渲染：每轮思考独立成卡、标题标注轮次；点击标题折叠/展开正文） */
        .think-card { margin-bottom: 12px; max-width: 100%; border-radius: 12px; background: #101d33; border: 1px solid #274a79; overflow: hidden; }
        .think-card .think-head { display: flex; align-items: center; gap: 7px; padding: 9px 12px; cursor: pointer; user-select: none; -webkit-user-select: none; }
        .think-card .think-arr { font-size: 10px; color: #6f96cf; transition: transform .15s; flex-shrink: 0; }
        .think-card.collapsed .think-arr { transform: rotate(-90deg); }
        .think-card .think-title { font-size: 13px; font-weight: bold; color: #8ab6ff; }
        .think-card .think-body { padding: 0 12px 10px; font-size: 13px; line-height: 1.6; color: #b9c7da; }
        .think-card .think-intent { font-size: 12px; color: #8fc3ff; background: rgba(79,140,220,.14); border-radius: 6px; padding: 5px 8px; margin-bottom: 6px; word-break: break-all; }
        .think-card .think-tool { font-size: 12px; color: #8fc3ff; background: rgba(79,140,220,.10); border-radius: 6px; padding: 5px 8px; margin-bottom: 6px; word-break: break-all; }
        .think-card .think-tool .tt-label { color: #6f96cf; }
        .think-card .think-tool .tt-target { color: #7e93b5; margin-top: 2px; }
        .think-card.collapsed .think-body { display: none; }
        body.light-theme .think-card { background: #f0f5fc; border-color: #b8cdea; }
        body.light-theme .think-card .think-title { color: #3a62c4; }
        body.light-theme .think-card .think-arr { color: #4a6ca0; }
        body.light-theme .think-card .think-body { color: #333; }
        body.light-theme .think-card .think-intent { color: #2c5bb0; background: rgba(58,98,196,.12); }
        body.light-theme .think-card .think-tool { color: #2c5bb0; background: rgba(58,98,196,.10); }
        body.light-theme .think-card .think-tool .tt-label { color: #4a6ca0; }
        body.light-theme .think-card .think-tool .tt-target { color: #5a6f95; }
        .bottom-bar {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: #16213e; border-top: 1px solid #0f3460;
            z-index: 50;
        }
        .status-bar {
            padding: 4px 16px; font-size: 11px; color: #888;
            border-bottom: 1px solid #0f3460; min-height: 20px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .input-area {
            padding: 8px 16px; display: flex; gap: 8px;
        }
        .input-area input {
            flex: 1; padding: 10px 14px; border: 1px solid #0f3460;
            border-radius: 20px; background: #1a1a2e; color: #eee; font-size: 14px;
        }
        .input-area button {
            padding: 10px 20px; background: #e94560; color: white;
            border: none; border-radius: 20px; font-size: 14px;
        }
        .config-panel { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); z-index: 100; }
        .config-panel.open { display: flex; align-items: center; justify-content: center; }
        .config-content { background: #16213e; padding: 24px; border-radius: 12px; width: 90%; max-width: 400px; }
        .config-content h2 { margin-bottom: 16px; color: #e94560; }
        .config-err { display: block; color: #ff8a8a; font-size: 12px; margin: -10px 0 12px; font-weight: normal; line-height: 1.6; }
        .config-err:empty { display: none; }   /* 无提示时不留占位，标题与输入框保持原间距 */
        .config-err.pending { color: #ffd700; }
        .config-err.ok { color: #6fdc8c; }
        body.light-theme .config-err.pending { color: #c77f00; }
        body.light-theme .config-err.ok { color: #1e8e4e; }
        .config-row { margin-bottom: 12px; }
        .config-row label { display: block; font-size: 12px; color: #aaa; margin-bottom: 4px; }
        .config-row input { width: 100%; padding: 10px; border: 1px solid #0f3460; border-radius: 6px; background: #1a1a2e; color: #eee; font-size: 14px; }
        .config-row input::placeholder { color: #888; }
        .config-actions { display: flex; gap: 8px; margin-top: 16px; }
        .config-actions button { flex: 1; padding: 10px; border: none; border-radius: 6px; font-size: 14px; }
        .btn-primary { background: #e94560; color: white; }
        .btn-secondary { background: #0f3460; color: #eee; }
        /* 切换角色模型面板（详情页顶栏图标点开）：底部抽屉 = 角色·模式两列 + 模型清单，点选即生效 */
        .exec-btn svg { display: block; }
        .exec-panel { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 110; background: rgba(0,0,0,0.55); }
        .exec-panel.open { display: block; }
        .exec-sheet {
            position: absolute; left: 0; right: 0; bottom: 0; max-height: 86vh;
            background: #16213e; border-radius: 16px 16px 0 0;
            display: flex; flex-direction: column; overflow: hidden;
            padding-bottom: env(safe-area-inset-bottom, 0px);
            animation: execUp .22s ease-out;
        }
        @keyframes execUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .exec-head { flex-shrink: 0; padding: 14px 16px 10px; border-bottom: 1px solid #0f3460; }
        .exec-head-t { display: flex; align-items: center; justify-content: space-between; }
        .exec-head h2 { margin: 0; font-size: 16px; color: #e94560; }
        .exec-close { background: none; border: none; color: #aaa; font-size: 20px; line-height: 1; cursor: pointer; padding: 2px 6px; }
        .exec-cur { font-size: 12px; color: #8899aa; margin-top: 6px; line-height: 1.5; word-break: break-all; }
        .exec-body { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 8px 12px 16px; }
        .exec-sec { font-size: 12px; color: #8899aa; margin: 12px 2px 6px; }
        .exec-cols { display: flex; gap: 8px; align-items: flex-start; }
        .exec-roles { width: 36%; flex-shrink: 0; display: flex; flex-direction: column; gap: 6px; max-height: 32vh; overflow-y: auto; }
        .exec-modes { flex: 1; display: flex; flex-direction: column; gap: 6px; max-height: 32vh; overflow-y: auto; }
        .exec-models { display: flex; flex-direction: column; gap: 6px; max-height: 32vh; overflow-y: auto; }
        .exec-item {
            text-align: left; padding: 9px 10px; border-radius: 10px;
            border: 1px solid #0f3460; background: #1a1a2e; color: #ddd;
            font-size: 13px; line-height: 1.35; cursor: pointer; word-break: break-all;
        }
        .exec-item .exec-sub { display: block; font-size: 11px; color: #889; margin-top: 3px; }
        .exec-item.active { border-color: #e94560; background: #2a1a2a; color: #fff; }
        .exec-item.active .exec-sub { color: #e8a0b0; }
        .exec-item.disabled { opacity: .45; cursor: not-allowed; }
        .exec-badge { display: inline-block; font-size: 10px; padding: 1px 5px; border-radius: 6px; background: #0f3460; color: #9fd0c0; margin-left: 4px; }
        .exec-msg { font-size: 12px; color: #ff8a8a; margin: 10px 2px; line-height: 1.6; }
        .exec-msg.ok { color: #6fdc8c; }
        .exec-msg:empty { display: none; }
        .exec-hint { font-size: 12px; color: #889; padding: 14px 4px; text-align: center; line-height: 1.6; }
        body.light-theme .exec-sheet { background: #fff; }
        body.light-theme .exec-head { border-bottom-color: #e6e6e6; }
        body.light-theme .exec-item { background: #f6f6f6; border-color: #e0e0e0; color: #333; }
        body.light-theme .exec-item.active { background: #fdecef; border-color: #e94560; color: #c0243f; }
        body.light-theme .exec-badge { background: #e4e9f2; color: #4a6a8a; }
        body.light-theme .exec-msg.ok { color: #1e8e4e; }
        .session-btn {
            background: none; border: none; color: #e94560;
            padding: 4px; font-size: 20px; cursor: pointer;
            width: 32px; height: 36px; display: flex; align-items: center; justify-content: center;
        }
        .header-actions { display: flex; flex-direction: row; align-items: center; gap: 2px; }
        /* 会话列表：全屏常驻底层页面 */
        .session-page {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 1;
            background: #1a1a2e; display: flex; flex-direction: column;
        }
        body.light-theme .session-page { background: #f5f5f5; }
        .session-page .header { position: relative; z-index: auto; }
        .session-page .seg-bar { padding: 8px 16px 0; flex-shrink: 0; }
        .session-page #sessionList { flex: 1; min-height: 0; overflow-y: auto; padding: 8px 16px 16px; -webkit-overflow-scrolling: touch; }
        /* 聊天详情：覆盖在会话列表之上的全屏面板，可通过边缘右滑关闭 */
        .chat-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 10;
            background: #1a1a2e; display: flex; flex-direction: column;
            transform: translateX(100%); transition: transform 0.3s ease;
        }
        body.light-theme .chat-overlay { background: #f5f5f5; }
        .chat-overlay.open { transform: translateX(0); }
        .session-item { padding: 12px; border: 1px solid #0f3460; border-radius: 8px; margin-bottom: 8px; cursor: pointer; }
        .session-item:hover { background: #0f3460; }
        .session-id { font-size: 14px; color: #eee; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .session-status { font-size: 12px; color: #888; margin-top: 4px; }
        .session-project { font-size: 11px; color: #666; margin-top: 2px; }
        .panel-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .panel-head h2 { margin-bottom: 0; }
        .panel-head .head-actions { display: flex; align-items: center; gap: 8px; }
        .panel-head button.btn-primary { padding: 6px 12px; border: none; border-radius: 6px; background: #e94560; color: #fff; font-size: 13px; }
        .icon-close { width: 30px; height: 30px; border: none; border-radius: 50%; background: #0f3460; color: #999; font-size: 15px; line-height: 1; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .icon-close:active { background: #1a4a7a; } .back-btn { width: 32px; height: 32px; border: none; border-radius: 50%; background: transparent; color: #eee; font-size: 22px; line-height: 1; padding-bottom: 2px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; } .back-btn:active { background: #0f3460; } body.light-theme .back-btn { color: #333; }
        .seg { display: flex; gap: 6px; margin-bottom: 12px; }
        .seg button { flex: 1; padding: 7px 0; font-size: 12px; color: #aaa; background: #0f3460; border: none; border-radius: 6px; cursor: pointer; }
        .seg button.on { background: #e94560; color: #fff; }
        .group-title { font-size: 12px; color: #888; margin: 10px 0 6px; }
        .session-item.current { border-color: #e94560; }
        .session-meta { display: flex; align-items: center; justify-content: space-between; margin-top: 4px; }
        .session-badge { font-size: 11px; color: #666; }
        .session-badge.live { color: #00d9ff; }
        .session-badge.desktop { color: #ffb454; }   /* 桌面执行中：手机只读观看 */
        body.light-theme .session-badge.desktop { color: #b26a00; }
        .session-time { font-size: 11px; color: #777; }
        .history-hint { color: #888; text-align: center; padding: 10px; font-size: 12px; }
        /* ---- 会话列表下拉刷新指示条（高度由 JS 在 touchmove 中动态设置） ---- */
        .ptr-wrap { height: 0; overflow: hidden; transition: height .2s ease-out; flex-shrink: 0; }
        .ptr-inner { height: 50px; line-height: 50px; text-align: center; font-size: 12px; color: #999; -webkit-user-select: none; user-select: none; }
        .close-btn { background: #0f3460; color: #eee; border: none; padding: 10px; border-radius: 6px; width: 100%; margin-top: 16px; }
        /* ---- 结论气泡 Markdown 格式化显示（对齐桌面渲染子集：标题/加粗/行内代码/列表/表格/代码块/引用/分隔线） ---- */
        .message.assistant { white-space: normal; }
        .md-p { margin: 5px 0; }
        .md-h { font-weight: bold; }
        .md-h1 { font-size: 16px; color: #9b9df9; margin: 9px 0 5px; }
        .md-h2 { font-size: 15px; color: #9b9df9; margin: 8px 0 4px; }
        .md-h3 { font-size: 14px; margin: 7px 0 3px; }
        .md-h4 { font-size: 14px; margin: 6px 0 2px; }
        .md-hr { border: none; border-top: 1px solid #2e3040; margin: 10px 0; }
        .md-li { margin: 3px 0; }
        .md-li .mk { color: #9b9df9; margin-right: 5px; }
        .md-q { border-left: 3px solid #9b9df9; padding: 3px 0 3px 10px; margin: 5px 0; color: #9aa0b4; }
        code.md-c { font-family: Consolas, Menlo, 'Courier New', monospace; font-size: 13px; background: rgba(0,0,0,0.25); color: #f0a13e; padding: 1px 5px; border-radius: 4px; }
        pre.md-pre { margin: 6px 0; background: rgba(0,0,0,0.25); border: 1px solid #2e3040; border-radius: 6px; padding: 9px 11px; overflow-x: auto; -webkit-overflow-scrolling: touch; }
        pre.md-pre code { display: block; font-family: Consolas, Menlo, 'Courier New', monospace; font-size: 12.5px; line-height: 1.55; color: #d6e2f0; white-space: pre-wrap; word-break: break-all; }
        table.md-table { border-collapse: collapse; width: 100%; margin: 7px 0; table-layout: fixed; font-size: 13px; }
        .md-table th, .md-table td { border: 1px solid #2e3040; padding: 5px 8px; text-align: left; vertical-align: top; word-break: break-word; }
        .md-table th { background: rgba(155,157,249,0.16); font-weight: bold; }
        body.light-theme .md-h1, body.light-theme .md-h2, body.light-theme .md-li .mk { color: #5b5fe0; }
        body.light-theme .md-hr { border-top-color: #ddd; }
        body.light-theme .md-q { border-left-color: #5b5fe0; color: #666; }
        body.light-theme code.md-c { background: #e8eaef; color: #b25c00; }
        body.light-theme pre.md-pre { background: #f2f3f6; border-color: #d7dae0; }
        body.light-theme pre.md-pre code { color: #333; }
        body.light-theme .md-table th, body.light-theme .md-table td { border-color: #d7dae0; }
        body.light-theme .md-table th { background: rgba(91,95,224,0.08); }
        /* ---- 执行中等待动画：最后一张卡片下方的走马灯小球 ---- */
        .wait-dots { display: flex; gap: 7px; justify-content: flex-start; align-items: center; padding: 14px 14px 6px; }
        .wait-dots span {
            width: 8px; height: 8px; border-radius: 50%;
            background: #5b5fe0; opacity: 0.25;
            animation: waitDotMarquee 1.1s ease-in-out infinite;
        }
        .wait-dots span:nth-child(2) { animation-delay: 0.15s; }
        .wait-dots span:nth-child(3) { animation-delay: 0.3s; }
        .wait-dots span:nth-child(4) { animation-delay: 0.45s; }
        .wait-dots span:nth-child(5) { animation-delay: 0.6s; }
        @keyframes waitDotMarquee {
            0%, 100% { opacity: 0.2; transform: translateY(0) scale(0.85); }
            50% { opacity: 1; transform: translateY(-5px) scale(1.1); }
        }
        body.light-theme .wait-dots span { background: #5b5fe0; }
        /* ---- 服务不可达/加载失败友好提示卡 ---- */
        .loading-hint { color: #888; text-align: center; padding: 40px 0; font-size: 13px; }
        .err-card {
            background: #261d33; border: 1px solid #7a4a52; border-radius: 14px;
            padding: 22px 18px; margin: 12px 0; text-align: center;
        }
        .err-card.lone { margin-top: 20vh; }
        .err-ico { font-size: 28px; line-height: 1.2; color: #ffb454; }
        .err-title { margin-top: 10px; font-size: 15px; font-weight: bold; color: #ffd9d9; line-height: 1.5; }
        .err-desc { margin-top: 10px; font-size: 13px; color: #cbb; line-height: 1.65; }
        .err-actions { margin-top: 16px; display: flex; gap: 10px; justify-content: center; }
        .err-actions button { padding: 9px 0; width: 112px; border: none; border-radius: 18px; font-size: 13px; cursor: pointer; }
        body.light-theme .err-card { background: #fff5f5; border-color: #e0b4b4; }
        body.light-theme .err-title { color: #a33333; }
        body.light-theme .err-desc { color: #7a5c5c; }
        /* 会话列表加载失败提示 */
        .list-err { text-align: center; padding: 18px 10px; color: #888; font-size: 12px; }
        .list-err-t { color: #ffb4b4; font-weight: bold; margin-bottom: 8px; line-height: 1.5; }
        .list-err-d { line-height: 1.6; margin-bottom: 14px; }
        .list-err button { padding: 8px 28px; border: none; border-radius: 16px; background: #e94560; color: #fff; font-size: 13px; cursor: pointer; }
        body.light-theme .list-err-t { color: #a33333; }
    </style>
</head>
<body>
    <!-- 底层：会话列表（常驻全屏页面） -->
    <div class="session-page" id="sessionPage">
        <div class="header">
            <div class="header-left">
                <h1 onclick="hardRefresh()" title="点击强制刷新">GAIRR</h1>
                <div class="status">
                    <span class="status-dot js-status-dot"></span>
                    <span class="js-status-text">未连接</span>
                </div>
            </div>
            <div class="header-actions">
                <button class="add-btn" onclick="newSession()" title="新建会话">+</button>
                <button class="theme-btn js-theme-btn" onclick="toggleTheme()">&#9788;</button>
                <button class="config-btn" onclick="toggleConfig()">&#9881;</button>
            </div>
        </div>
        <div class="seg-bar">
            <div class="seg" id="sessionSeg">
                <button data-cat="all" class="on">全部</button>
                <button data-cat="mobile">手机端</button>
                <button data-cat="normal">普通</button>
                <button data-cat="plan">计划</button>
            </div>
        </div>
        <div id="ptrWrap" class="ptr-wrap"><div class="ptr-inner" id="ptrInner">下拉刷新会话列表</div></div>
        <div id="sessionList"></div>
    </div>
    <!-- 上层：聊天详情（覆盖面板，边缘右滑关闭回到列表） -->
    <div class="chat-overlay" id="chatOverlay">
        <div class="header">
            <div class="status" style="gap:8px;">
                <input type="button" class="back-btn" id="backBtn" value="‹" onclick="closeChat()" title="返回" aria-label="返回会话列表"><span class="status-dot js-status-dot" id="statusDot"></span>
                <span id="chatStatusText" style="font-size:12px;color:#888;white-space:nowrap;">未连接</span>
                <span class="js-session-title" id="sessionTitle" style="font-size:15px;color:#eee;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:60vw;">选择会话</span>
            </div>
            <div class="header-actions">
                <button class="theme-btn js-theme-btn" onclick="toggleTheme()" id="themeBtn">&#9788;</button>
                <!-- 切换角色模型（连接配置已收敛到列表页 ⚙；详情页这个位置改为角色/模型切换） -->
                <button class="config-btn exec-btn" id="execBtn" onclick="openExecPanel()" title="切换角色模型" aria-label="切换角色模型"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l4 4-4 4"></path><path d="M3 6h18"></path><path d="M7 22l-4-4 4-4"></path><path d="M21 18H3"></path></svg></button>
            </div>
        </div>
        <div class="chat-container" id="chatContainer"></div>
        <div class="bottom-bar">
            <div class="status-bar" id="statusBar"></div>
            <div class="input-area">
                <input type="text" id="messageInput" placeholder="输入消息..." disabled>
                <button id="sendBtn" onclick="sendMessage()" disabled>发送</button>
            </div>
        </div>
    </div>
    <div class="config-panel" id="configPanel">
        <div class="config-content">
            <h2>连接配置</h2>
            <div id="configErr" class="config-err"></div>
            <div class="config-row">
                <label>服务器地址</label>
                <input type="text" id="serverUrl" value="http://app.gairr.com/api">
            </div>
            <div class="config-row">
                <label>Token</label>
                <input type="text" id="token" placeholder="手工输入访问令牌（必填）">
            </div>
            <div class="config-row">
                <label>项目路径</label>
                <input type="text" id="projectPath" value="d:\\work\\gairr">
            </div>
            <div class="config-actions">
                <button class="btn-primary" onclick="connect()">连接</button>
                <button class="btn-secondary" onclick="toggleConfig()">取消</button>
            </div>
        </div>
    </div>
    <!-- 切换角色模型面板（详情页顶栏图标点开）：角色·模式两列 + 模型清单，点选即写会话执行参数 -->
    <div class="exec-panel" id="execPanel" onclick="closeExecPanel()">
        <div class="exec-sheet" onclick="event.stopPropagation()">
            <div class="exec-head">
                <div class="exec-head-t">
                    <h2>切换角色 · 模型</h2>
                    <button class="exec-close" onclick="closeExecPanel()" aria-label="关闭">&#10005;</button>
                </div>
                <div class="exec-cur" id="execCur">加载中...</div>
            </div>
            <div class="exec-body" id="execBody"><div class="exec-hint">加载中...</div></div>
            <div class="exec-msg" id="execMsg" style="flex-shrink:0;margin:0;padding:0 16px 12px;"></div>
        </div>
    </div>
    <script>
        var state = {
            serverUrl: 'http://app.gairr.com/api',
            token: localStorage.getItem('gairr_token') || '',
            projectPath: 'd:\\work\\gairr',
            sessionId: null,
            sessionProject: null,
            isConnected: false,
            isBusy: false,
            lastContent: '',
            lastStatusText: '',
            currentReplyDiv: null,
            roundKeys: {},         // 已渲染的"第N轮思考"卡片指纹（轮次+内容签名），防 SSE 全量重扫重复建卡
            roundTools: {},        // 轮次→本轮工具中文标题集合（ToolStart 先于 Round 到达，缓存供思考卡渲染"执行工具"行）
            sseXhr: null,
            sessionCategory: 'all',
            guiWatch: false,   // 桌面实时观看模式（resume 409：桌面端执行中，SSE 订阅 GUI 镜像流，只读）
            retryFn: null,     // 错误卡“重试”按钮绑定的最近一次失败操作
            dangerCard: null,  // 当前展示中的危险确认卡片 DOM（同会话仅一个挂起确认，重复事件幂等跳过）
            planCard: null,    // 当前展示中的方案确认卡片 DOM（同会话仅一个挂起方案，按 planId 幂等判重）
            listLoading: false,     // 会话列表加载中（防并发刷新）
            idleLast: 0             // 详情面板最近一次有效操作时间（5 分钟无操作自动断开）
        };
        // 打开聊天详情覆盖面板（从右侧滑入）
        function openChat() {
            document.getElementById('chatOverlay').classList.add('open');
            startIdleMonitor();   // 进入详情开始 5 分钟无操作计时
        }
        // 关闭聊天详情（滑出回到会话列表）
        function closeChat() {
            stopIdleMonitor();   // 详情已关闭，停止无操作计时
            document.getElementById('chatOverlay').classList.remove('open');
            setSessionTitle('');   // 重置详情页标题
            setChatStatus('', '未连接');   // 重置详情页状态，避免残留只读/监控中等会话级状态
            closeSSE();
            state.isConnected = false;
            state.guiWatch = false;
            if (state.watchTimer) { clearInterval(state.watchTimer); state.watchTimer = null; }
            // 回到列表时无感刷新：走 setListChildren 增量对齐、复用既有节点，不闪"加载中"占位也不跳滚动，
            // 详情期间发生的状态变化（发消息/新建/自动释放/桌面执行中）回来即刻可见
            silentRefreshSessionList();
        }
        // 聊天覆盖面板上的左→右滑动关闭手势
        (function() {
            var overlay = document.getElementById('chatOverlay');
            var sx = null, sy = null;
            overlay.addEventListener('touchstart', function(e) {
                sx = e.touches[0].clientX;
                sy = e.touches[0].clientY;
            }, { passive: true });
            overlay.addEventListener('touchmove', function(e) {
                if (sx === null) return;
                var dx = e.touches[0].clientX - sx;
                var dy = e.touches[0].clientY - sy;
                // 水平为主 + 向右滑超过阈值 → 关闭
                if (dx > 60 && dx > Math.abs(dy) * 1.5) {
                    sx = sy = null;
                    closeChat();
                }
            }, { passive: true });
            overlay.addEventListener('touchend', function() { sx = sy = null; }, { passive: true });
        })();
        // 加载会话列表；quiet=true 时不闪“加载中”占位（下拉刷新/静默轮询复用），完成后回调 done
        function loadSessionList(quiet, done) {
            if (state.listLoading) { if (done) done(); return; }
            state.listLoading = true;
            var container = document.getElementById('sessionList');
            if (!quiet) container.innerHTML = '<div style="color:#888;text-align:center;padding:20px;">加载中...</div>';
            httpRequest('GET', state.serverUrl + '/sessions?project=' + encodeURIComponent(state.projectPath), {
                'Authorization': 'Bearer ' + state.token
            }, null, function(status, response) {
                state.listLoading = false;
                if (status != 200) {
                    if (!quiet) {
                        var h = errHint(status);
                        container.innerHTML = '<div class="list-err">'
                            + '<div class="list-err-t">&#9888; 加载会话列表失败：' + htmlEsc(h.title) + '</div>'
                            + '<div class="list-err-d">' + htmlEsc(h.desc) + '</div>'
                            + '<button onclick="loadSessionList()">重试</button></div>';
                    }
                    if (done) done();
                    return;
                }
                state.sessionCache = JSON.parse(response).sessions || [];
                renderSessionList();
                startListRefresh();   // 首次成功拉取后启动每分钟静默刷新
                if (done) done();
            });
        }
        // 按当前分类（全部/手机端/普通/计划）渲染会话列表
        function renderSessionList() {
            var container = document.getElementById('sessionList');
            var sessions = state.sessionCache || [];
            var cat = state.sessionCategory;
            if (cat != 'all') {
                sessions = sessions.filter(function(s) { return s.category === cat; });
            }
            var actHtml = '', histHtml = '', actN = 0, histN = 0, shown = 0;
            for (var i = 0; i < sessions.length; i++) {
                var it = sessions[i];
                var title = (it.title && it.title.trim()) ? it.title : it.sessionId;
                var time = fmtTime(it.updatedAt);
                var isCurrent = it.sessionId === state.sessionId;
                var isLive = !!(it.active || it.busy);   // 活跃（可对话/监控）或桌面执行中 → 归顶部活跃组
                var html = '<div class="session-item' + (isCurrent ? ' current' : '') + '" data-sid="' + htmlEsc(it.sessionId) + '" data-project="' + htmlEsc(it.project || state.projectPath) + '" data-title="' + htmlEsc(title) + '"' + (it.busy ? ' data-busy="1"' : '') + '>';
                html += '<div class="session-id">' + htmlEsc(title) + '</div>';
                html += '<div class="session-meta">';
                if (it.busy) {
                    html += '<span class="session-badge desktop">桌面执行中</span>';
                } else if (it.active) {
                    var label = it.state == 'idle' ? '可切换' : (it.state == 'busy' ? '执行中' : '待处理');
                    html += '<span class="session-badge live">' + label + '</span>';
                } else {
                    html += '<span class="session-badge">历史</span>';
                }
                html += '<span class="session-time">' + time + '</span>';
                html += '</div></div>';
                if (isLive) { actHtml += html; actN++; }
                else if (shown < 30) { histHtml += html; shown++; histN++; }
            }
            var out = '';
            if (actN > 0) out += '<div class="group-title">活跃会话（' + actN + '）</div>' + actHtml;
            if (histN > 0 || sessions.length > actN) {
                out += '<div class="group-title">历史会话（最近 ' + histN + '）</div>' + histHtml;
                if (sessions.length - actN > 30) {
                    out += '<div class="history-hint">共 ' + (sessions.length - actN) + ' 个历史会话，仅显示最近 30 个</div>';
                }
            }
            if (!out) out = '<div style="color:#888;text-align:center;padding:20px;">' + catName(cat) + '暂无会话，点右上角新建</div>';
            container.innerHTML = out;
        }
        // ──── 会话列表增强：下拉刷新 / 每分钟无感刷新 / 详情 5 分钟无操作自动断开 ────

        // 每分钟静默轮询会话列表：只插新会话、更新状态，DOM 增量同步不打断浏览
        var listRefreshTimer = null;
        function startListRefresh() {
            if (listRefreshTimer) return;
            listRefreshTimer = setInterval(function() {
                if (document.hidden) return;
                if (document.getElementById('chatOverlay').classList.contains('open')) return; // 详情页打开时不打扰（关闭时会回刷）
                silentRefreshSessionList();
            }, 60000);
        }
        function silentRefreshSessionList() {
            if (state.listLoading) return;
            state.listLoading = true;
            httpRequest('GET', state.serverUrl + '/sessions?project=' + encodeURIComponent(state.projectPath), {
                'Authorization': 'Bearer ' + state.token
            }, null, function(status, response) {
                state.listLoading = false;
                if (status != 200) return;   // 静默轮询失败不打扰用户
                state.sessionCache = JSON.parse(response).sessions || [];
                setListChildren(document.getElementById('sessionList'), buildListNodes(state.sessionCache));
            });
        }
        // 构建列表目标节点序列（与 renderSessionList 相同的分组与排序规则，但输出 DOM 节点）
        function buildListNodes(sessions) {
            var cat = state.sessionCategory;
            var arr = sessions;
            if (cat != 'all') arr = sessions.filter(function(s) { return s.category === cat; });
            var act = [], rest = [];
            for (var i = 0; i < arr.length; i++) {
                if (arr[i].active || arr[i].busy) act.push(arr[i]);
                else rest.push(arr[i]);
            }
            var hist = rest.slice(0, 30);
            var out = [];
            if (act.length) {
                out.push(makeGroupTitle('活跃会话（' + act.length + '）'));
                for (var a = 0; a < act.length; a++) out.push(sessionItemNode(act[a]));
            }
            if (rest.length) {
                out.push(makeGroupTitle('历史会话（最近 ' + hist.length + '）'));
                for (var b = 0; b < hist.length; b++) out.push(sessionItemNode(hist[b]));
                if (rest.length > 30) {
                    var hint = document.createElement('div');
                    hint.className = 'history-hint';
                    hint.textContent = '共 ' + rest.length + ' 个历史会话，仅显示最近 30 个';
                    out.push(hint);
                }
            }
            if (!out.length) {
                var empty = document.createElement('div');
                empty.style.cssText = 'color:#888;text-align:center;padding:20px;';
                empty.textContent = catName(cat) + '暂无会话，点右上角新建';
                out.push(empty);
            }
            return out;
        }
        function makeGroupTitle(text) {
            var d = document.createElement('div');
            d.className = 'group-title';
            d.textContent = text;
            return d;
        }
        // 生成/复用单个会话条目节点（data-sid 相同的旧节点就地更新，避免重排滚动位置）
        function sessionItemNode(it) {
            var title = (it.title && it.title.trim()) ? it.title : it.sessionId;
            var time = fmtTime(it.updatedAt);
            var isCurrent = it.sessionId === state.sessionId;
            var listEl = document.getElementById('sessionList');
            var n = null;
            for (var c = listEl.firstElementChild; c; c = c.nextElementSibling) {
                if (c.className && (' ' + c.className + ' ').indexOf(' session-item ') > -1
                    && c.getAttribute('data-sid') === it.sessionId) { n = c; break; }
            }
            if (!n) n = document.createElement('div');
            n.className = 'session-item' + (isCurrent ? ' current' : '');
            n.setAttribute('data-sid', it.sessionId);
            n.setAttribute('data-project', it.project || state.projectPath);
            n.setAttribute('data-title', title);
            if (it.busy) n.setAttribute('data-busy', '1'); else n.removeAttribute('data-busy');
            var h = '<div class="session-id">' + htmlEsc(title) + '</div><div class="session-meta">';
            if (it.busy) {
                h += '<span class="session-badge desktop">桌面执行中</span>';
            } else if (it.active) {
                var label = it.state == 'idle' ? '可切换' : (it.state == 'busy' ? '执行中' : '待处理');
                h += '<span class="session-badge live">' + label + '</span>';
            } else {
                h += '<span class="session-badge">历史</span>';
            }
            h += '<span class="session-time">' + time + '</span></div>';
            n.innerHTML = h;
            return n;
        }
        // 把列表 DOM 对齐到 desired 序列：既有条目优先复用移动（不重建），多余旧节点（含陈旧分组标题）删除
        function setListChildren(listEl, desired) {
            var cur = listEl.firstElementChild, idx = 0;
            while (idx < desired.length) {
                var want = desired[idx];
                if (cur === want) { cur = cur.nextElementSibling; idx++; continue; }
                listEl.insertBefore(want, cur);
                idx++;
            }
            while (cur) { var nx = cur.nextElementSibling; listEl.removeChild(cur); cur = nx; }
        }

        // 下拉刷新手势：列表置顶下拉超过阈值触发无感刷新（quiet，不闪“加载中”占位）
        (function() {
            var listEl = document.getElementById('sessionList');
            var wrap = document.getElementById('ptrWrap');
            var inner = document.getElementById('ptrInner');
            if (!listEl || !wrap) return;
            var startY = null, dist = 0, TRIG = 52;
            function chatOpen() { return document.getElementById('chatOverlay').classList.contains('open'); }
            function resetWrap() { wrap.style.height = '0'; dist = 0; inner.textContent = '下拉刷新会话列表'; }
            listEl.addEventListener('touchstart', function(e) {
                if (chatOpen() || listEl.scrollTop > 0) { startY = null; return; }
                startY = e.touches[0].clientY;
                dist = 0;
            }, { passive: true });
            listEl.addEventListener('touchmove', function(e) {
                if (startY === null) return;
                if (listEl.scrollTop > 0) return;
                var dy = e.touches[0].clientY - startY;
                if (dy <= 0) { if (dist > 0) resetWrap(); return; }
                if (e.cancelable) e.preventDefault();
                dist = Math.min(dy * 0.45, TRIG + 24);
                wrap.style.height = dist + 'px';
                inner.textContent = dist >= TRIG ? '松开立即刷新' : '下拉刷新会话列表';
            }, { passive: false });
            function endPull() {
                if (startY === null) return;
                startY = null;
                if (dist < TRIG) { resetWrap(); return; }
                inner.textContent = '刷新中…';
                wrap.style.height = '48px';
                loadSessionList(true, function() {
                    inner.textContent = '刷新完成';
                    setTimeout(resetWrap, 500);
                });
            }
            listEl.addEventListener('touchend', endPull, { passive: true });
            listEl.addEventListener('touchcancel', function() { startY = null; resetWrap(); }, { passive: true });
        })();

        // 详情面板 5 分钟无操作自动断开：回列表；空闲会话同时通知服务端释放（离开活跃集回历史）
        var IDLE_MS = 5 * 60 * 1000;
        var idleTick = null;
        function startIdleMonitor() {
            stopIdleMonitor();
            state.idleLast = Date.now();
            idleTick = setInterval(function() {
                if (document.hidden) { state.idleLast = Date.now(); return; }   // 退后台不计时（避免一进来就被断）
                if (!document.getElementById('chatOverlay').classList.contains('open')) { stopIdleMonitor(); return; }
                if (Date.now() - state.idleLast >= IDLE_MS) autoReleaseCurrent();
            }, 15000);
        }
        function stopIdleMonitor() { if (idleTick) { clearInterval(idleTick); idleTick = null; } }
        function noteActivity() { if (idleTick) state.idleLast = Date.now(); }
        // 全局捕获：用户在详情页任何触碰/滚动/按键都视为“正在查看”，重置计时
        (function() {
            var evs = ['touchstart', 'touchmove', 'pointerdown', 'wheel', 'keydown', 'scroll'];
            for (var i = 0; i < evs.length; i++) document.addEventListener(evs[i], noteActivity, true);
        })();
        function autoReleaseCurrent() {
            var overlay = document.getElementById('chatOverlay');
            if (!overlay.classList.contains('open')) return;
            stopIdleMonitor();
            var sid = state.sessionId;
            showStatusBar('5 分钟未操作，已自动断开');
            // 空闲会话才通知服务端释放回历史；执行中/桌面观看等忙态会被服务端 409 拒绝，仅本地断开
            if (sid && !state.guiWatch) {
                httpRequest('POST', state.serverUrl + '/sessions/' + encodeURIComponent(sid) + '/release?project=' + encodeURIComponent(state.sessionProject || state.projectPath), {
                    'Authorization': 'Bearer ' + state.token
                }, null, function() {});
            }
            closeChat();   // 内部会断开 SSE 并回到列表刷新
        }

        function catName(c) {
            if (c == 'mobile') return '手机端';
            if (c == 'normal') return '普通';
            if (c == 'plan') return '计划';
            return '';
        }
        function viewSession(sessionId, project, busy, title) {
            // 已是当前会话且连接正常：不重复加载；例外——目标会话“桌面执行中”（busy）而当前仅普通连接（非观看流）：
            // 该连接是桌面开跑前 resume 200 建立的静止监控，点进来不会自动升级，需重进走 409 → 切入观看流
            if (state.sessionId === sessionId && state.isConnected && state.sessionProject === project
                && !(busy && !state.guiWatch)) {
                openChat();   // 已在查看，直接打开聊天面板
                setSessionTitle(title || sessionId);
                showStatusBar('当前已在查看该会话');
                return;
            }
            if (busy && !state.guiWatch && state.sessionId === sessionId)
                showStatusBar('桌面端正在执行该会话，切换实时观看…');
            attachSession(sessionId, project || state.projectPath);
            setSessionTitle(title || sessionId);   // 详情页 header 显示会话标题
            openChat();   // 打开聊天详情覆盖面板
        }
        // 点击 GAIRR 标题：注销 Service Worker + 清空缓存 + 带时间戳跳转（强制拿最新页面）
        function hardRefresh() {
            try {
                if ('serviceWorker' in navigator && navigator.serviceWorker) {
                    navigator.serviceWorker.getRegistrations().then(function(regs) {
                        regs.forEach(function(r) { r.unregister(); });
                    }).catch(function() {});
                }
            } catch (e) {}
            try {
                if ('caches' in window && window.caches) {
                    caches.keys().then(function(ks) {
                        ks.forEach(function(k) { caches.delete(k); });
                    }).catch(function() {});
                }
            } catch (e) {}
            // 等异步清理提交后再跳转，避免被旧缓存拦截；
            // 用 replace 不向历史栈压入新条目 —— 强刷后手机左滑/系统返回手势不会退到旧页面
            setTimeout(function() {
                location.replace(location.pathname + '?_=' + Date.now());
            }, 300);
        }
        // PWA 自愈：历史"添加到主屏幕"安装的 Service Worker 可能持有旧页面缓存
        // （早期 sw.js 对 navigate 是 cache-first，还会拦截自身的更新检查，导致永远拿不到新版页面）。
        // 本页不依赖 SW 离线能力，故每次加载检测到 SW 即注销全部注册 + 清空 Cache Storage，
        // 清理完成后强制刷新一次拿最新页面；sessionStorage 标记防重载循环。
        (function swSelfHeal() {
            try {
                if (!('serviceWorker' in navigator) || !navigator.serviceWorker) return;
                navigator.serviceWorker.getRegistrations().then(function(regs) {
                    if (!regs.length) return;
                    if (sessionStorage.getItem('gairr_sw_healed')) return;
                    sessionStorage.setItem('gairr_sw_healed', '1');
                    var tasks = [];
                    regs.forEach(function(r) { tasks.push(r.unregister()); });
                    if ('caches' in window && window.caches) {
                        tasks.push(caches.keys().then(function(ks) {
                            return Promise.all(ks.map(function(k) { return caches.delete(k); }));
                        }));
                    }
                    Promise.all(tasks).then(function() { location.reload(); });
                }).catch(function() {});
            } catch (e) {}
        })();

        function toggleConfig() {
            var panel = document.getElementById('configPanel');
            var opening = !panel.classList.contains('open');
            panel.classList.toggle('open');
            if (opening) document.getElementById('configErr').textContent = ''; // 重新打开时清除上次失败提示
        }
        /* ---------- 切换角色模型（详情页顶栏图标 → 底部抽屉：角色·模式 + 模型） ----------
           数据源：GET /roles（roles/ 热加载）、GET /models（config.ini [Providers]×models）、
                  GET/POST /sessions/{id}/exec（会话级执行参数，落 SessionRecord.Meta，resume/重启后仍生效）。
           交互：左列角色只切换右列内容（不提交）；点模式或模型即提交并即时生效；
                会话执行中服务端会拒绝（409），提示等本轮结束再切。 */
        var exec = { roles: [], models: [], cur: null, selRole: '', defProvider: '', defModel: '', busy: false };

        function execHeaders(withJson) {
            var h = { 'Authorization': 'Bearer ' + state.token };
            if (withJson) h['Content-Type'] = 'application/json';
            return h;
        }
        // 会话执行参数接口 URL：带 project（服务端 hub 未命中时据此恢复会话）
        function execApiUrl() {
            var proj = state.sessionProject || state.projectPath || '';
            return state.serverUrl + '/sessions/' + encodeURIComponent(state.sessionId) + '/exec?project=' + encodeURIComponent(proj);
        }
        function openExecPanel() {
            if (!state.sessionId) { showStatusBar('请先打开一个会话'); return; }
            document.getElementById('execPanel').classList.add('open');
            loadExecData();
        }
        function closeExecPanel() {
            document.getElementById('execPanel').classList.remove('open');
            setExecMsg('');
        }
        function setExecMsg(text, ok) {
            var el = document.getElementById('execMsg');
            el.textContent = text || '';
            el.className = 'exec-msg' + (ok ? ' ok' : '');
            el.style.cssText = 'flex-shrink:0;margin:0;padding:' + (text ? '0 16px 12px;' : '0;');
        }
        // 统一解析：非 2xx 或 JSON 解析失败返回 null（服务端错误体为 {error:"..."}，可能带 200/400/404/409）
        function parseExec(status, text) {
            if (status < 200 || status >= 300) return null;
            try { return JSON.parse(text); } catch (e) { return null; }
        }
        function loadExecData() {
            var bodyEl = document.getElementById('execBody');
            exec.busy = true;
            setExecMsg('');
            document.getElementById('execCur').textContent = '加载中...';
            bodyEl.innerHTML = '<div class="exec-hint">加载中...</div>';
            httpRequest('GET', state.serverUrl + '/roles', execHeaders(false), null, function(st, txt) {
                var roles = parseExec(st, txt);
                if (roles === null) { exec.busy = false; bodyEl.innerHTML = '<div class="exec-hint">角色清单加载失败（HTTP ' + st + '）</div>'; return; }
                httpRequest('GET', state.serverUrl + '/models', execHeaders(false), null, function(st2, txt2) {
                    var models = parseExec(st2, txt2);
                    if (models === null) { exec.busy = false; bodyEl.innerHTML = '<div class="exec-hint">模型清单加载失败（HTTP ' + st2 + '）</div>'; return; }
                    httpRequest('GET', execApiUrl(), execHeaders(false), null, function(st3, txt3) {
                        exec.busy = false;
                        exec.roles = roles.roles || [];
                        exec.models = models.models || [];
                        exec.defProvider = models.defaultProvider || '';
                        exec.defModel = models.defaultModel || '';
                        // 当前参数取不到（会话未恢复/桌面占用）不阻断：清单照常可点，只是没有"当前"高亮
                        var cur = parseExec(st3, txt3);
                        exec.cur = (cur && !cur.error) ? cur : null;
                        exec.selRole = (exec.cur && exec.cur.role) || (exec.roles[0] && exec.roles[0].name) || '';
                        renderExecPanel();
                        if (cur && cur.error) setExecMsg(cur.error);
                    });
                });
            });
        }
        function renderExecPanel() {
            var cur = exec.cur || {};
            var curProv = cur.provider || exec.defProvider, curModel = cur.model || exec.defModel;
            document.getElementById('execCur').textContent = exec.cur
                ? exec.cur.summary
                : '未指定角色模式（引擎默认）' + (curProv ? ' · ' + curProv + ' ' + curModel : '');
            var sel = null, i;
            for (i = 0; i < exec.roles.length; i++) if (exec.roles[i].name === exec.selRole) sel = exec.roles[i];
            var h = '<div class="exec-sec">角色 · 工作模式（点模式即生效）</div><div class="exec-cols"><div class="exec-roles">';
            if (!exec.roles.length) h += '<div class="exec-hint">暂无角色<br>（roles/ 目录为空）</div>';
            for (i = 0; i < exec.roles.length; i++) {
                var r = exec.roles[i];
                h += '<button type="button" class="exec-item' + (r.name === exec.selRole ? ' active' : '') + '"'
                   + ' onclick="pickExecRole(\'' + jsAttr(r.name) + '\')">'
                   + htmlEsc((r.icon ? r.icon + ' ' : '') + (r.displayName || r.name)) + '</button>';
            }
            h += '</div><div class="exec-modes">';
            if (sel && sel.modes && sel.modes.length) {
                for (i = 0; i < sel.modes.length; i++) {
                    var m = sel.modes[i];
                    var on = (cur.role === sel.name && cur.mode === m.name);
                    h += '<button type="button" class="exec-item' + (on ? ' active' : '') + '"'
                       + ' onclick="pickExecMode(\'' + jsAttr(sel.name) + '\',\'' + jsAttr(m.name) + '\')">'
                       + htmlEsc((m.icon ? m.icon + ' ' : '') + (m.displayName || m.name))
                       + (m.hasFlow ? '<span class="exec-badge">流程</span>' : '')
                       + (m.description ? '<span class="exec-sub">' + htmlEsc(m.description) + '</span>' : '')
                       + '</button>';
                }
            } else h += '<div class="exec-hint">该角色暂无工作模式</div>';
            h += '</div></div>';
            h += '<div class="exec-sec">模型（点选即生效）</div><div class="exec-models">';
            if (!exec.models.length) h += '<div class="exec-hint">暂无可用模型<br>（config.ini [Providers] 未配置）</div>';
            for (i = 0; i < exec.models.length; i++) {
                var o = exec.models[i];
                var on2 = (curProv === o.provider && curModel === o.model);
                h += '<button type="button" class="exec-item' + (on2 ? ' active' : '') + (o.hasKey ? '' : ' disabled') + '"'
                   + (o.hasKey ? ' onclick="pickExecModel(\'' + jsAttr(o.provider) + '\',\'' + jsAttr(o.model) + '\')"' : ' disabled') + '>'
                   + htmlEsc((o.providerDisplay || o.provider) + ' · ' + (o.model || o.display))
                   + (o.hasKey ? '' : '<span class="exec-badge">无 Key</span>')
                   + '</button>';
            }
            h += '</div>';
            document.getElementById('execBody').innerHTML = h;
        }
        function pickExecRole(name) { exec.selRole = name; renderExecPanel(); }
        function pickExecMode(role, mode) { postExec({ role: role, mode: mode }); }
        function pickExecModel(provider, model) { postExec({ provider: provider, model: model }); }
        function postExec(body) {
            if (exec.busy) return;
            exec.busy = true;
            setExecMsg('切换中...');
            httpRequest('POST', execApiUrl(), execHeaders(true), JSON.stringify(body), function(st, txt) {
                exec.busy = false;
                var res = null;
                try { res = JSON.parse(txt); } catch (e) { res = null; }
                if (!res || res.error || st < 200 || st >= 300) {
                    setExecMsg((res && res.error) || ('切换失败（HTTP ' + st + '）'));
                    return;
                }
                exec.cur = res;
                if (res.role) exec.selRole = res.role;
                renderExecPanel();
                var msg = '已切换：' + (res.summary || '');
                setExecMsg(msg, true);
                showStatusBar(msg);
            });
        }
        // 内联 onclick 参数转义：反斜杠/单引号转义、双引号转实体（角色/模型名来自本地配置，仍按不可信处理）
        function jsAttr(s) {
            return String(s == null ? '' : s).replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '&quot;');
        }
        function setThemeIcon(btns, isLight) {
            for (var i = 0; i < btns.length; i++) {
                btns[i].innerHTML = isLight ? '&#9790;' : '&#9788;';
                btns[i].style.fontSize = isLight ? '18px' : '24px';
                btns[i].style.paddingTop = isLight ? '4px' : '6px';
                btns[i].style.webkitTextStroke = isLight ? '' : '1.5px #e94560';
            }
        }
        function toggleTheme() {
            var body = document.body;
            var btns = document.querySelectorAll('.js-theme-btn');
            if (body.classList.contains('light-theme')) {
                body.classList.remove('light-theme');
                setThemeIcon(btns, false);
                localStorage.setItem('gairr_theme2', 'dark');
            } else {
                body.classList.add('light-theme');
                setThemeIcon(btns, true);
                localStorage.setItem('gairr_theme2', 'light');
            }
        }
        function initTheme() {
            // v11: 默认深色主题（与顶栏同色），不再按时间段自动切浅色；
            // 读新 key gairr_theme2 并清除旧 key 的 'light' 残留，已缓存浅色的设备会回落到深色。
            localStorage.removeItem('gairr_theme');
            var savedTheme = localStorage.getItem('gairr_theme2');
            var btns = document.querySelectorAll('.js-theme-btn');
            if (savedTheme === 'light') {
                document.body.classList.add('light-theme');
                setThemeIcon(btns, true);
            } else {
                setThemeIcon(btns, false);
            }
        }
        // 列表页顶部状态：只反映全局连接状态（连接中/已连接/连接失败），不被详情页会话级状态污染
        function setStatus(status, text) {
            var scope = document.getElementById('sessionPage');
            var dots = scope.querySelectorAll('.js-status-dot');
            var txts = scope.querySelectorAll('.js-status-text');
            for (var i = 0; i < dots.length; i++) dots[i].className = 'status-dot js-status-dot ' + status;
            for (var i = 0; i < txts.length; i++) txts[i].textContent = text;
        }
        // 详情页顶部状态：会话级状态（加载中/已连接/监控中/只读/不可用），与列表页状态互不影响
        function setChatStatus(status, text) {
            var dot = document.getElementById('statusDot');
            if (dot) dot.className = 'status-dot js-status-dot ' + status;
            var el = document.getElementById('chatStatusText');
            if (el) el.textContent = text;
        }
        // 更新详情页 header 的会话标题
        function setSessionTitle(title) {
            var el = document.getElementById('sessionTitle');
            if (el) el.textContent = title || '选择会话';
        }
        function showStatusBar(text) {
            // 执行信息去重：SSE 全量重扫会使同一帧重复到达（如 Log/工具调用反复回放下发），
            // 连续相同内容直接跳过；仅过滤紧邻重复，不影响跨轮次合法重复信息
            if (text === state.lastStatusText) return;
            state.lastStatusText = text;
            document.getElementById('statusBar').textContent = text;
        }
        // 清除聊天区残留的服务错误卡（连接成功/重试前调用）
        function clearServerError() {
            var old = document.getElementById('chatContainer').querySelector('.err-card');
            if (old) old.parentNode.removeChild(old);
        }
        // 错误分级 → 友好标题与指引（核心引导：先开启桌面程序的 APP 端服务）
        function errHint(status) {
            if (status == 0 || status == 502 || status == 503 || status == 504) {
                // 0=浏览器未收到响应；502/503/504=中转 nginx 连不通电脑上的 Agent Server(8123)
                return {
                    title: '桌面端 APP 服务未开启或网络不可达',
                    desc: '请求没有到达你的电脑。请先运行桌面程序 GAIRR 并开启「APP 端服务」（gairr-agent-server，端口 8123），确认手机与电脑之间的隧道/网络正常，然后重试。'
                };
            }
            if (status == 401 || status == 403) {
                return { title: '访问令牌无效或已过期', desc: '请点击右上角 ⚙ 打开连接配置，重新填写 Token 后重试。' };
            }
            if (status == 404) {
                return { title: '会话不存在或已被删除', desc: '请返回会话列表选择其它会话，或点「+ 新建」创建新会话。' };
            }
            return { title: '服务异常（HTTP ' + status + '）', desc: '服务器未能完成请求。若桌面程序未开启「APP 端服务」，请先开启后再试；也可稍后重试。' };
        }
        // 聊天区渲染友好错误卡：无对话内容时居中大卡；已有对话内容时置顶横幅（不覆盖内容）
        function renderServerError(status, phase, retry) {
            var h = errHint(status);
            var container = document.getElementById('chatContainer');
            // 先移除旧的加载占位与错误卡（同一时刻只保留一张卡）
            var ph = container.querySelector('.loading-hint');
            if (ph) container.removeChild(ph);
            clearServerError();
            var card = document.createElement('div');
            card.className = 'err-card';
            if (container.childElementCount === 0) card.classList.add('lone');
            state.retryFn = retry || null;
            card.innerHTML = '<div class="err-ico">&#9888;</div>'
                + '<div class="err-title">' + htmlEsc(phase ? phase + '失败：' + h.title : h.title) + '</div>'
                + '<div class="err-desc">' + htmlEsc(h.desc) + '</div>'
                + '<div class="err-actions"><button class="btn-primary" onclick="retryLast()">重试</button>'
                + '<button class="btn-secondary" onclick="toggleConfig()">连接配置</button></div>';
            container.insertBefore(card, container.firstChild);
            setChatStatus('', '加载失败');
            showStatusBar(h.title);
        }
        // 错误卡“重试”按钮：执行最近一次失败的操作（闭包内已绑定正确的会话与参数）
        function retryLast() {
            if (state.retryFn) state.retryFn();
        }
        function addMessage(text, type) {
            var container = document.getElementById('chatContainer');
            var div = document.createElement('div');
            div.className = 'message ' + type;
            div.textContent = text;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
            return div;
        }
        function updateOrCreateReply(text) {
            if (text === state.lastContent) return;
            state.lastContent = text;
            var container = document.getElementById('chatContainer');
            if (state.currentReplyDiv) {
                state.currentReplyDiv.innerHTML = mdToHtml(text);
            } else {
                state.currentReplyDiv = document.createElement('div');
                state.currentReplyDiv.className = 'message assistant';
                state.currentReplyDiv.innerHTML = mdToHtml(text);
                container.appendChild(state.currentReplyDiv);
            }
            container.scrollTop = container.scrollHeight;
        }
        function finishReply() {
            state.currentReplyDiv = null;
            state.lastContent = '';
        }
        // ---- 执行中等待动画（走马灯小球）：常驻最后一张卡片下方，执行结束隐藏 ----
        // ensureWaitDots 复用单个元素：appendChild 对已存在节点是"移动到末尾"，
        // 流式/思考/工具等卡片追加后再次调用即可让小球始终保持在容器最底部
        function ensureWaitDots() {
            var container = document.getElementById('chatContainer');
            var dots = document.getElementById('waitDots');
            if (!dots) {
                dots = document.createElement('div');
                dots.id = 'waitDots';
                dots.className = 'wait-dots';
                dots.innerHTML = '<span></span><span></span><span></span><span></span><span></span>';
            }
            if (container.lastElementChild !== dots) {
                container.appendChild(dots);   // 已存在时等同移动到末尾
                container.scrollTop = container.scrollHeight;
            }
        }
        function hideWaitDots() {
            var dots = document.getElementById('waitDots');
            if (dots && dots.parentNode) dots.parentNode.removeChild(dots);
        }
        // 动画显隐与执行状态联动：本会话执行中（isBusy）或观看桌面执行中（guiWatch）时展示
        function syncWaitDots() {
            if (state.isBusy || state.guiWatch) ensureWaitDots();
            else hideWaitDots();
        }
        // 英文工具 id → 中文名兜底映射（常规流只有 ToolUi 中文标题；仅 tool_call 裸 id 事件才走到这里）
        function toolCnName(id) {

                Edit: '编辑文件', Write: '写入文件', Bash: '执行命令', DbQuery: '数据库查询', MapTrace: '符号检索',
                ListDir: '目录列表', Map: '项目地图', DingTalk: '发送钉钉消息', NewsDigest: '资讯摘要', UpdateTodo: '更新待办',
                MarketList: '插件市场', MarketInstall: '安装插件', MarketUninstall: '卸载插件', GhSearch: 'GitHub 搜索',
                GhInstallSkill: '安装技能', GhUninstall: '卸载技能', ImageOcr: '图片识别', RecallHistory: '历史回忆', LoadSkill: '加载技能' };

        // "执行工具"行：标题按首个空格拆为 中文名 + 目标（路径/命令单独一行）；

        function thinkToolHtml(title) {
            var name = title, target = '';
            var sp = title.indexOf(' ');
            if (sp > 0) {
                var rest = title.slice(sp + 1);
                if (/[\/\\:]|^["'`]|^\.\.?$/.test(rest)) { name = title.slice(0, sp); target = rest; }
            }
            var h = '<div class="think-tool"><span class="tt-label">执行工具：</span><span class="tt-name">' + htmlEsc(name) + '</span>';
            if (target) h += '<div class="tt-target">' + htmlEsc(target) + '</div>';

        // 每轮思考渲染为"第 N 轮思考"卡片（标题标注轮次，意图与推理正文可折叠展示）
        // 幂等：SSE onprogress 全量重扫会让同一帧反复到达，用 轮次+内容签名 判重，只建一次卡
        function showThinkingCard(ev) {
            var round = ev.Round || 0;
            if (round <= 0) return;                       // Finished 等事件 Round=0，不在此分支
            var reasoning = String(ev.Reasoning || '');
            var intent = String(ev.Intent || '').trim();
            var key = round + '|' + reasoning.slice(0, 60) + '|' + intent.slice(0, 40);
            if (state.roundKeys[key]) return;
            state.roundKeys[key] = 1;
            var container = document.getElementById('chatContainer');
            var card = document.createElement('div');
            card.className = 'think-card';
            var parts = [];
            // 本轮已执行的工具（ToolStart 缓存）：中文名 + 目标文件/命令，仅展示不显示结果
            var tools = state.roundTools[round];
            if (tools) {
                for (var t in tools) parts.push(thinkToolHtml(t));
            }
            if (intent) parts.push('<div class="think-intent">意图：' + htmlEsc(intent) + '</div>');
            var body = reasoning.trim();
            if (body) parts.push(mdToHtml(reasoning));
            // 无意图也无思考正文：只显示标题行（单行轮次标注），不可折叠
            if (parts.length === 0) card.classList.add('collapsed');
            card.innerHTML = '<div class="think-head"><span class="think-arr">&#9660;</span>'
                + '<span class="think-title">第 ' + round + ' 轮思考</span></div>'
                + (parts.length ? '<div class="think-body">' + parts.join('') + '</div>' : '');
            container.appendChild(card);
            container.scrollTop = container.scrollHeight;

                card.querySelector('.think-head').style.cursor = 'default';
            }
        }
        function setInputEnabled(enabled) {
            document.getElementById('messageInput').disabled = !enabled;

        function httpRequest(method, url, headers, body, callback) {
            var xhr = new XMLHttpRequest();
            xhr.open(method, url, true);
            for (var key in headers) {
                xhr.setRequestHeader(key, headers[key]);
            }
            xhr.onreadystatechange = function() {
                if (xhr.readyState == 4) {
                    callback(xhr.status, xhr.responseText);
                }
            };
            xhr.onerror = function() {
                callback(0, 'Network error');
            };
            xhr.send(body || null);
        }
        function connect() {
            var errEl = document.getElementById('configErr');
            errEl.textContent = '';
            errEl.className = 'config-err';
            state.serverUrl = document.getElementById('serverUrl').value.trim();
            state.token = document.getElementById('token').value.trim();
            state.projectPath = document.getElementById('projectPath').value.trim();
            if (!state.serverUrl || !state.token) {
                // 配置不完整：标题后红字提示
                errEl.textContent = '请填写服务器地址和 Token';
                showStatusBar('请填写服务器地址和 Token');
                return;
            }
            // 手工填写的 token 保存到手机本地（页面刷新后自动恢复）
            localStorage.setItem('gairr_token', state.token);

            setChatStatus('connecting', '连接中...');
            showStatusBar('连接中...');

            errEl.textContent = '连接中...';
            errEl.className = 'config-err pending';
            httpRequest('GET', state.serverUrl + '/health', {
                'Authorization': 'Bearer ' + state.token
            }, null, function(status, response) {
                if (status == 200 || status == 201) {
                    var data = JSON.parse(response);
                    setStatus('connected', '已连接');
                    setChatStatus('connected', '已连接');
                    showStatusBar('服务器连接成功 (' + data.sessions + ' 个活跃会话)');
                    clearServerError();   // 成功连上：清除此前可能残留的错误卡
                    // 连接成功：立即关闭配置窗口
                    document.getElementById('configPanel').classList.remove('open');
                    // 先检查是否有现有会话
                    checkExistingSession();
                } else {
                    var h = errHint(status);
                    setStatus('', '连接失败');
                    setChatStatus('', '连接失败');

                    errEl.textContent = h.title;

            });

        function checkExistingSession() {

            loadSessionList();

        // 加载会话历史 + 恢复会话 + 连接SSE（切换会话的核心流程，幂等）
        function attachSession(sessionId, project) {
            closeSSE();
            if (state.watchTimer) { clearInterval(state.watchTimer); state.watchTimer = null; }   // 退出观看定时器
            state.sessionId = sessionId;
            state.sessionProject = project;
            state.isConnected = false;
            state.isBusy = false;
            state.guiWatch = false;
            state.currentReplyDiv = null;
            state.lastContent = '';
            state.roundKeys = {};
            state.roundTools = {};
            state.dangerCard = null;   // 切换会话：旧卡片随容器清空失效，重置引用防误判重
            state.planCard = null;     // 同上：方案确认卡片引用一并重置
            setInputEnabled(false);
            setChatStatus('connecting', '加载中...');
            showStatusBar('正在加载会话历史...');
            // 切换会话：清掉旧会话内容与错误卡，先显示加载占位（renderHistory/renderServerError 会替换）
            document.getElementById('chatContainer').innerHTML = '<div class="loading-hint">正在加载会话历史...</div>';
            httpRequest('GET', state.serverUrl + '/sessions/' + encodeURIComponent(sessionId) + '/history?project=' + encodeURIComponent(project), {
                'Authorization': 'Bearer ' + state.token
            }, null, function(status, response) {
                if (state.sessionId !== sessionId) return;   // 已切换到其它会话：丢弃迟到的历史加载
                if (status == 200) {
                    var data = JSON.parse(response);
                    renderHistory(data.messages || [], data.total || 0);
                    var tip = (data.title && data.title.trim()) ? data.title : sessionId;
                    if (data.total > (data.messages || []).length) tip += '（显示最近 ' + data.messages.length + '/共 ' + data.total + ' 条）';
                    showStatusBar(tip);
                } else {
                    // 加载失败：不再继续 resume（网络不通/服务未开时 resume 也必失败），展示友好指引卡片
                    renderServerError(status, '加载会话历史', function() { attachSession(sessionId, project); });
                    return;
                }
                resumeSession(sessionId, project);
            });
        }
        // 恢复会话到服务端进程（幂等；成功后连接SSE可续聊/监控）
        function resumeSession(sessionId, project) {
            httpRequest('POST', state.serverUrl + '/sessions/' + encodeURIComponent(sessionId) + '/resume?project=' + encodeURIComponent(project), {
                'Authorization': 'Bearer ' + state.token
            }, null, function(status, response) {
                if (state.sessionId !== sessionId) return;   // 已切换到其它会话：丢弃迟到的恢复响应（防止旧回调覆盖/拉回旧会话）
                if (status == 200) {
                    var data = JSON.parse(response);
                    state.sessionId = data.sessionId || sessionId;
                    state.isConnected = true;
                    var running = data.state && data.state != 'idle';
                    state.isBusy = !!running;   // 恢复时服务端仍在执行 → 同步执行态，等待动画随之显隐
                    setChatStatus('connected', running ? '监控中' : '已连接');
                    setInputEnabled(!running);
                    syncWaitDots();
                    if (running) showStatusBar('会话执行中（只读监控）: ' + state.sessionId);
                    localStorage.setItem('gairr_sid', state.sessionId);
                    localStorage.setItem('gairr_sproj', project);
                    // 服务端权威挂起详情：重进会话直接补建待处理危险卡（重放帧可能已丢失/被过期过滤）
                    if (data.pendingDanger) showDangerAlert(data.pendingDanger);
                    connectSSE();
                } else if (status == 409) {
                    state.isConnected = false;
                    // 409 语义分流：桌面 GUI 源会话（8 位 hex）才可能是"桌面端执行中 → 观看桌面 GUI 流"；
                    // 移动端 s-* 会话由 Server 本机执行（hub 活跃时 resume 已幂等返回 200），此 409 多为
                    // 任务残留/竞态——若也进观看流，Server 无该会话 GUI 帧 → 立即 no_live → 自动重连 → 死循环，
                    // 危险确认卡（SecurityAlert 经常规 /events 流）永远弹不出。故非 hex 会话给出重试入口而非观看。
                    if (/^[0-9a-f]{8}$/i.test(sessionId)) {
                        startGuiWatch(sessionId);
                    } else {
                        setChatStatus('', '待重试');
                        setInputEnabled(false);
                        renderServerError(409, '恢复会话', function() { resumeSession(sessionId, project); });
                    }
                } else {
                    state.isConnected = false;
                    setChatStatus('', '不可用');
                    setInputEnabled(false);
                    renderServerError(status, '恢复会话', function() { resumeSession(sessionId, project); });
                }
            });
        }
        // 渲染历史对话到聊天区（切换会话前先清空）
        function renderHistory(messages, total) {
            var container = document.getElementById('chatContainer');
            container.innerHTML = '';
            state.currentReplyDiv = null;
            state.lastContent = '';

            state.roundTools = {};
