                var m = messages[i];
                var div = document.createElement('div');
                var isUser = m.role == 'user';
                div.className = 'message ' + (isUser ? 'user' : 'assistant');
                // 助手结论/历史按 Markdown 格式化渲染；用户发言保持原样纯文本
                if (isUser) div.textContent = m.content;
                else div.innerHTML = mdToHtml(m.content);
                container.appendChild(div);
            }
            if (total > messages.length) {
                var hint = document.createElement('div');
                hint.className = 'history-hint';
                hint.textContent = '仅显示最近 ' + messages.length + ' 条，共 ' + total + ' 条对话';
                container.appendChild(hint);
            }
            syncWaitDots();   // 历史已清空重绘：按当前执行态决定等待动画显隐
            container.scrollTop = container.scrollHeight;
        }
        // 新建会话（列表页入口）
        function newSession() {
            closeSSE();
            state.currentReplyDiv = null;
            state.lastContent = '';
            state.roundKeys = {};
            state.roundTools = {};
            createSession();
        }
        function htmlEsc(s) {
            return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }
        // ---- 危险命令确认：Server 推 SecurityAlert(Level=Confirm) 时展示决策卡片，按钮 POST /sessions/{id}/decisions ----
        // 幂等说明：SSE 解析为 onprogress 全量重扫，同一事件会重复到达；AgentLoop 保证同会话同时只有一个挂起确认，
        // 故以"卡片 dataset.cmd/pattern 相同"判重；已决策卡片保留为墓碑引用（不置 null），重扫帧一律跳过，
        // 否则会话继续后重放的历史帧反复重建卡片。被桌面端处理时卡片直接移除、不残留提示。
        function markDangerResolved() {
            // 会话已继续（新工具/流式/收口事件到达）：挂起确认已被桌面端或其它端处理，未决策卡片直接移除、不再展示提示
            // 注意：保留 state.dangerCard 墓碑引用（dataset.done='1'），供 showDangerAlert 判重挡历史帧重放
            if (state.dangerCard && !state.dangerCard.dataset.done) {
                state.dangerCard.dataset.done = '1';
                var el = state.dangerCard;
                if (el.parentNode) el.parentNode.removeChild(el);
            }
        }
        function showDangerAlert(alert) {
            if (!alert) return;
            var level = alert.Level || alert.level || 'Block';
            var cmd = alert.Command || alert.command || '';
            var pattern = alert.Pattern || alert.pattern || '';
            var intent = alert.Intent || alert.intent || '';
            // 重复帧判重：同命令同规则的卡片（含已决策墓碑）已登记则跳过，挡 SSE 全量重扫的历史帧重放
            if (state.dangerCard && state.dangerCard.dataset.cmd === cmd
                && state.dangerCard.dataset.pattern === pattern) return;
            var container = document.getElementById('chatContainer');
            var card = document.createElement('div');
            card.className = 'danger-card';
            card.dataset.cmd = cmd;
            card.dataset.pattern = pattern;
            var html = '<div class="danger-title">⚠️ 危险命令' + (level === 'Confirm' ? '待确认' : '已拦截') + '</div>'
                + '<div class="danger-cmd">' + htmlEsc(cmd) + '</div>';
            if (pattern) html += '<div class="danger-meta">命中规则：' + htmlEsc(pattern) + '</div>';
            if (intent) html += '<div class="danger-intent">意图：' + htmlEsc(intent) + '</div>';
            if (level === 'Confirm') {
                // 观看模式（桌面端执行中，resume 409）同样出按钮：决策改走 /gui-decisions 写桌面端收件箱，
                // 桌面端危险卡挂起期间轮询消费（与方案审批同一链路），不再仅提示去桌面端处理
                html += '<div class="danger-btns"><button class="btn-allow">✔ 允许执行</button><button class="btn-deny">✘ 取消</button></div>';
            }
            card.innerHTML = html;
            container.appendChild(card);
            container.scrollTop = container.scrollHeight;
            if (level === 'Confirm') {
                state.dangerCard = card;   // 观看模式也登记：判重收尾逻辑依赖 state.dangerCard
                card.querySelector('.btn-allow').onclick = function() { decideDanger(card, true); };
                card.querySelector('.btn-deny').onclick = function() { decideDanger(card, false); };
            }
        }
        // 危险决策提交：成功后卡片收尾；409/404=已被桌面端处理或无权限，提示收尾；网络类失败恢复按钮可重试
        function decideDanger(card, allow) {
            var btns = card.querySelector('.danger-btns');
            btns.innerHTML = '<div class="danger-done pending">提交中…</div>';
            // 观看模式（桌面端持有会话）：/decisions 路由不到桌面端，改走 /gui-decisions 写收件箱；
            // 正常监视模式（本会话由手机端发起）仍走 /decisions 直接裁决
            var url = state.serverUrl + '/sessions/' + encodeURIComponent(state.sessionId)
                + (state.guiWatch ? '/gui-decisions' : '/decisions');
            var body = state.guiWatch
                ? JSON.stringify({planId: '', type: 'danger', allow: allow})
                : JSON.stringify({type: 'danger', allow: allow});
            httpRequest('POST', url, {
                'Authorization': 'Bearer ' + state.token,
                'Content-Type': 'application/json'
            }, body, function(status, response) {
                if (status == 200) {
                    // 决策成功：状态栏反馈后整体隐藏卡片（用户要求：操作成功即隐藏，不留已完成卡片占位）；
                    // 保留 state.dangerCard 墓碑引用（dataset.done='1'），挡后续重扫对同一 SecurityAlert 帧的重放重建
                    card.dataset.done = '1';
                    btns.innerHTML = '<div class="danger-done ' + (allow ? 'allowed' : 'denied') + '">' + (allow ? '✔ 已允许执行' : '✘ 已取消') + '</div>';
                    showStatusBar(allow ? '危险命令已允许执行' : '危险命令已取消');
                    setTimeout(function() { if (card.parentNode) card.parentNode.removeChild(card); }, 800);
                } else if (status == 409 || status == 404) {

                    card.dataset.done = '1';
                    if (card.parentNode) card.parentNode.removeChild(card);
                } else {
                    showStatusBar('危险决策失败（HTTP ' + status + '），可重试');
                    btns.innerHTML = '<button class="btn-allow">✔ 允许执行</button><button class="btn-deny">✘ 取消</button>';
                    card.querySelector('.btn-allow').onclick = function() { decideDanger(card, true); };
                    card.querySelector('.btn-deny').onclick = function() { decideDanger(card, false); };
                }
            });
        }
        // ---- 方案确认：Server 推 PlanConfirm 帧（桌面弹方案框）时展示决策卡片，按钮 POST /sessions/{id}/gui-decisions ----
        // 幂等说明：SSE 解析为 onprogress 全量重扫，同一帧会重复到达；以卡片 dataset.planId 判重，
        // 同会话同时只有一个挂起方案（桌面弹窗模型保证），未决策前重复帧不再新建。
        function showPlanConfirm(info) {
            if (!info) return;
            var planId = info.PlanId || info.planId || '';
            if (!planId) return;
            // 重复帧判重：同方案卡片（含已决策墓碑）已登记则跳过，挡 SSE 全量重扫的历史帧重放
            if (state.planCard && state.planCard.dataset.planId === planId) return;
            var title = info.Title || info.title || '';
            var goal = info.Goal || info.goal || '';
            var planMode = info.PlanMode || info.planMode || '';
            var nodeCount = info.NodeCount || info.nodeCount || 0;
            var container = document.getElementById('chatContainer');
            var card = document.createElement('div');
            card.className = 'plan-card';
            card.dataset.planId = planId;
            var html = '<div class="plan-title">&#128203; 方案待确认</div>';
            if (title) html += '<div class="plan-name">' + htmlEsc(title) + '</div>';
            if (planMode) html += '<div class="plan-meta">模式：' + htmlEsc(planMode) + '</div>';
            if (nodeCount) html += '<div class="plan-meta">共 ' + nodeCount + ' 个执行节点</div>';
            if (goal) html += '<div class="plan-goal">目标：' + htmlEsc(goal) + '</div>';
            html += '<div class="plan-btns"><button class="btn-approve">✔ 批准执行</button><button class="btn-reject">✘ 取消</button></div>';
            card.innerHTML = html;
            container.appendChild(card);
            container.scrollTop = container.scrollHeight;
            state.planCard = card;
            card.querySelector('.btn-approve').onclick = function() { decidePlan(card, true); };
            card.querySelector('.btn-reject').onclick = function() { decidePlan(card, false); };
        }
        // PlanResolved 收尾：决策已定（手机自己提交 / 桌面端本地确认），未决策卡片按结果显示并关闭
        // 保留 state.planCard 墓碑引用（dataset.done='1'），供 showPlanConfirm 判重挡历史帧重放
        function resolvePlanCard(info) {
            var planId = info ? (info.PlanId || info.planId || '') : '';
            var card = state.planCard;
            if (!card || card.dataset.done) return;   // 无挂起卡片或已自行收尾（自提交成功路径）
            if (planId && card.dataset.planId !== planId) return;   // 其它方案的帧，忽略
            card.dataset.done = '1';
            var btns = card.querySelector('.plan-btns');
            if (btns) {
                var allow = info ? !!(info.Allow || info.allow) : false;
                btns.innerHTML = '<div class="plan-done ' + (allow ? 'allowed' : 'denied') + '">'
                    + (allow ? '✔ 方案已批准' : '✘ 方案已取消') + '</div>';
            }
        }
        // 方案决策提交：成功后卡片收尾；409/404=已被桌面端处理，提示收尾；网络类失败恢复按钮可重试
        function decidePlan(card, allow) {
            var btns = card.querySelector('.plan-btns');
            btns.innerHTML = '<div class="plan-done pending">提交中…</div>';
            httpRequest('POST', state.serverUrl + '/sessions/' + encodeURIComponent(state.sessionId) + '/gui-decisions', {
                'Authorization': 'Bearer ' + state.token,

        // ---- 轻量 Markdown → HTML（对齐桌面 Markdown.cs 渲染子集）----
        // 块级：代码块/分隔线/标题/表格/列表/引用/段落；行内：**加粗** 与 `代码`。
        // 安全：所有原文先转义再入 HTML（防注入），产物可安全用于 innerHTML。
        function mdInline(s) {
            var out = '', buf = '', i = 0;
            function flush() { if (buf) { out += htmlEsc(buf); buf = ''; } }
            while (i < s.length) {
                if (s.charAt(i) === '`') {
                    var j = s.indexOf('`', i + 1);
                    if (j > i) { flush(); out += '<code class="md-c">' + htmlEsc(s.substring(i + 1, j)) + '</code>'; i = j + 1; continue; }
                }
                if (s.charAt(i) === '*' && s.charAt(i + 1) === '*') {
                    var k = s.indexOf('**', i + 2);
                    if (k > i) { flush(); out += '<b>' + mdInline(s.substring(i + 2, k)) + '</b>'; i = k + 2; continue; }
                }

        }
        function mdSplitRow(row) {
            var s = row.trim();

            if (s.charAt(s.length - 1) === '|') s = s.substring(0, s.length - 1);
            var cells = s.split('|'), out = [];
            for (var i = 0; i < cells.length; i++) out.push(cells[i].trim());
            return out;

        function mdToHtml(md) {
            md = String(md == null ? '' : md).replace(/\r\n?/g, '\n');
            var lines = md.split('\n'), n = lines.length, i = 0, html = '';
            while (i < n) {
                var t = lines[i].trim();
                // 代码块 ``` ... ```（未闭合时收到全文末尾，与桌面一致）
                if (t.indexOf('```') === 0) {
                    var code = [], j = i + 1, closed = false;
                    for (; j < n; j++) {
                        if (lines[j].replace(/^\s+/, '').indexOf('```') === 0) { closed = true; break; }
                        code.push(lines[j]);
                    }
                    html += '<pre class="md-pre"><code>' + htmlEsc(code.join('\n')) + '</code></pre>';
                    i = closed ? j + 1 : n;
                    continue;
                }
                // 分隔线 --- / ___ / ───
                if (/^[-─_]{3,}$/.test(t)) { html += '<div class="md-hr"></div>'; i++; continue; }
                // 标题 #~####
                var hm = /^(#{1,4})\s+(.*)$/.exec(t);
                if (hm) { html += '<div class="md-h md-h' + hm[1].length + '">' + mdInline(hm[2]) + '</div>'; i++; continue; }
                // 表格：当前行以 | 开头且下一行是含 - 的分隔行
                var nxt = i + 1 < n ? lines[i + 1].trim() : '';
                if (t.charAt(0) === '|' && nxt.indexOf('-') >= 0 && /^[\s|:-]+$/.test(nxt)) {
                    var rows = [], k = i;
                    while (k < n && lines[k].trim().charAt(0) === '|') { rows.push(lines[k].trim()); k++; }
                    i = k;
                    var head = mdSplitRow(rows[0]), hd = '', bd = '';
                    for (var c = 0; c < head.length; c++) hd += '<th>' + mdInline(head[c]) + '</th>';
                    for (var r = 2; r < rows.length; r++) {
                        var cells = mdSplitRow(rows[r]), td = '';
                        for (var c2 = 0; c2 < head.length; c2++) td += '<td>' + mdInline(c2 < cells.length ? cells[c2] : '') + '</td>';
                        bd += '<tr>' + td + '</tr>';
                    }
                    html += '<table class="md-table"><thead><tr>' + hd + '</tr></thead><tbody>' + bd + '</tbody></table>';
                    continue;
                }
                // 无序列表 - * •
                var um = /^[-*•]\s+(.*)$/.exec(t);
                if (um) { html += '<div class="md-li"><span class="mk">•</span><span>' + mdInline(um[1]) + '</span></div>'; i++; continue; }
                // 有序列表 1. 1)
                var om = /^(\d+)[.)]\s+(.*)$/.exec(t);
                if (om) { html += '<div class="md-li"><span class="mk">' + om[1] + '.</span><span>' + mdInline(om[2]) + '</span></div>'; i++; continue; }
                // 引用 >
                if (t.charAt(0) === '>') { html += '<div class="md-q">' + mdInline(t.replace(/^[\s>]+/, '')) + '</div>'; i++; continue; }
                if (!t) { i++; continue; }
                // 普通段落
                html += '<div class="md-p">' + mdInline(t) + '</div>';
                i++;
            }
            return html;
        }

                    showStatusBar('自动连接失败：' + h.title);
                    // 配置窗标题旁红字同步显示原因
                    document.getElementById('configErr').textContent = h.title;
                    document.getElementById('configErr').className = 'config-err';
                    // 聊天区错误卡（取消配置窗后可见）：可点“重试”
                    renderServerError(status, '自动连接', function() { autoConnect(); });
                    toggleConfig();
                }
            });
        }
        
        // 页面加载完成后自动连接
        window.addEventListener('load', function() {
            initTheme();
            // 恢复本地保存的 token 到输入框（页面不预填默认值，刷新不受影响）
            var tk = localStorage.getItem('gairr_token');
            if (tk) document.getElementById('token').value = tk;
            autoConnect();
        });
    </script>
</body>
</html>
