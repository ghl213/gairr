<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#16213e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>🐱 技术喵</title>
<style>
    /* 技术喵演示页：单文件、零外部依赖。视觉沿用 site/gairr-mobile/index-v3.html 配色与圆角 */
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; }
    body {
        background: #16213e; color: #eee;
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
        font-size: 14px; line-height: 1.5; overflow: hidden;
        display: flex; flex-direction: column;
    }
    /* ---------- 顶栏 ---------- */
    .header {
        position: fixed; top: 0; left: 0; right: 0; z-index: 20;
        display: flex; align-items: center; gap: 8px;
        padding: calc(8px + env(safe-area-inset-top, 0px)) 12px 8px;
        background: #16213e; border-bottom: 1px solid #0f3460;
    }
    .brand { font-size: 17px; font-weight: bold; color: #e94560; white-space: nowrap; }
    .src-chip {
        font-size: 11px; padding: 3px 8px; border-radius: 10px; white-space: nowrap;
        background: #2a2f45; color: #b9c0d4; border: 1px solid #3a4058;
    }
    .src-chip.live { background: #16351f; color: #4fdc7f; border-color: #2c6b41; }
    .src-chip.demo { background: #3a3320; color: #ffd166; border-color: #6b5c2c; }
    .spacer { flex: 1; }
    .icon-btn {
        width: 34px; height: 34px; border: none; border-radius: 10px; background: #1f2a44;
        color: #cfd6e6; font-size: 16px; line-height: 1; cursor: pointer;
    }
    .icon-btn:active { background: #2b3a5c; }
    .icon-btn.spin { animation: spin .9s linear infinite; }
    @keyframes spin { from { transform: rotate(0) } to { transform: rotate(360deg) } }
    /* ---------- 内容区 ---------- */
    .content {
        flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
        padding: 12px 12px calc(84px + env(safe-area-inset-bottom, 0px));
        padding-top: calc(62px + env(safe-area-inset-top, 0px));
    }
    .sec-title { font-size: 12px; color: #8c95ad; margin: 14px 2px 8px; }
    .sec-title:first-child { margin-top: 2px; }
    .card {
        background: #1b2540; border: 1px solid #0f3460; border-radius: 12px;
        padding: 12px 14px; margin-bottom: 10px;
    }
    .card.tap { cursor: pointer; }
    .card.tap:active { border-color: #e94560; }
    .row { display: flex; align-items: center; gap: 8px; }
    .grow { flex: 1; min-width: 0; }
    .name { font-size: 15px; font-weight: bold; color: #fff; word-break: break-all; }
    .sub { font-size: 12px; color: #98a1b8; word-break: break-all; }
    .sub.dim { color: #6d7591; }
    .pill {
        font-size: 11px; padding: 2px 8px; border-radius: 8px; white-space: nowrap;
        background: #23304d; color: #9fb4dd;
    }
    .pill.on { background: #1e3d2a; color: #4fdc7f; }
    .pill.off { background: #3a2a2a; color: #e77; }
    .pill.warn { background: #3a3320; color: #ffd166; }
    .prompt-line {
        margin-top: 8px; padding: 8px 10px; border-radius: 8px; background: #14203a;
        color: #c8d2e8; font-size: 13px; white-space: pre-wrap; word-break: break-word;
        border-left: 3px solid #e94560;
    }
    .notice {
        display: flex; align-items: center; gap: 8px; font-size: 12px;
        padding: 9px 12px; border-radius: 10px; margin-bottom: 10px;
        background: #33291a; color: #ffd166; border: 1px solid #6b5c2c;
    }
    .notice.ok { background: #16351f; color: #7fe0a1; border-color: #2c6b41; }
    .notice.err { background: #3a2020; color: #ff9c9c; border-color: #7a3b3b; }
    .notice button {
        margin-left: auto; border: none; border-radius: 8px; padding: 5px 10px;
        background: #e94560; color: #fff; font-size: 12px; font-weight: bold;
    }
    .empty { text-align: center; color: #8c95ad; padding: 28px 16px; }
    .empty .big { display: block; font-size: 30px; margin-bottom: 8px; }
    .badge-demo {
        font-size: 10px; padding: 1px 6px; border-radius: 6px; margin-left: 6px;
        background: #4a3c17; color: #ffd166; vertical-align: middle;
    }
    /* ---------- 打卡网格 ---------- */
    .week { display: flex; gap: 6px; margin-top: 10px; }
    .day {
        flex: 1; text-align: center; padding: 7px 0; border-radius: 9px;
        background: #16203a; border: 1px solid #26314f; cursor: pointer;
    }
    .day .d { font-size: 10px; color: #7b849c; }
    .day .k { font-size: 14px; margin-top: 2px; }
    .day.on { background: #16351f; border-color: #2c6b41; }
    .day.on .k { color: #4fdc7f; }
    .day.future { opacity: .45; }
    /* ---------- 统计 ---------- */
    .stat { display: flex; gap: 10px; }
    .stat .box { flex: 1; background: #16203a; border: 1px solid #26314f; border-radius: 10px; padding: 10px; }
    .stat .k { font-size: 18px; font-weight: bold; color: #fff; }
    .stat .l { font-size: 11px; color: #8c95ad; margin-top: 2px; }
    table.led { width: 100%; border-collapse: collapse; font-size: 13px; }
    table.led th { font-size: 11px; color: #8c95ad; text-align: left; padding: 4px 6px; font-weight: normal; }
    table.led td { padding: 7px 6px; border-top: 1px solid #22304c; color: #dfe5f2; }
    table.led td.amt { text-align: right; color: #ffb3c1; font-variant-numeric: tabular-nums; }
    /* ---------- 聊天 ---------- */
    .composer {
        position: fixed; left: 0; right: 0; z-index: 21; display: none;
        bottom: 0;
        background: #131c34; border-top: 1px solid #0f3460;
        padding: 8px 10px; gap: 8px; align-items: flex-end;
    }
    .composer.show { display: flex; }
    .composer textarea {
        flex: 1; resize: none; height: 38px; max-height: 100px; padding: 9px 11px;
        border-radius: 10px; border: 1px solid #26314f; background: #101830; color: #eef2fb;
        font-size: 14px; font-family: inherit; line-height: 1.35; box-sizing: border-box;
    }
    .composer .send {
        border: none; border-radius: 10px; padding: 0 15px; height: 38px;
        background: #e94560; color: #fff; font-weight: bold; font-size: 14px; cursor: pointer;
    }
    .composer .send:disabled { opacity: .45; }
    body.tab-chat .content { padding-bottom: calc(80px + env(safe-area-inset-bottom, 0px)); }
    .msg { display: flex; margin-bottom: 10px; }
    .msg .bubble { max-width: 84%; padding: 9px 12px; border-radius: 14px; font-size: 14px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
    .msg.user { justify-content: flex-end; }
    .msg.user .bubble { background: #e94560; color: #fff; border-bottom-right-radius: 4px; }
    .msg.assistant .bubble { background: #1b2540; color: #eef2fb; border: 1px solid #0f3460; border-bottom-left-radius: 4px; }
    .msg.system { justify-content: center; }
    .msg.system .bubble { background: none; color: #8c95ad; font-size: 12px; padding: 2px 0; max-width: 100%; text-align: center; }
    .bubble h1, .bubble h2, .bubble h3, .bubble h4 { margin: 4px 0 6px; font-size: 16px; line-height: 1.35; }
    .bubble h1 { font-size: 18px; } .bubble h2 { font-size: 17px; }
    .bubble p { margin: 2px 0; }
    .bubble ul, .bubble ol { margin: 4px 0; padding-left: 20px; }
    .bubble li { margin: 2px 0; }
    .bubble code { background: rgba(255,255,255,.12); border-radius: 4px; padding: 1px 4px; font-size: 12px; font-family: Consolas, Menlo, monospace; }
    .bubble pre { background: rgba(0,0,0,.35); border: 1px solid #26314f; border-radius: 8px; padding: 8px 10px; overflow-x: auto; margin: 6px 0; }
    .bubble pre code { background: none; padding: 0; }
    .bubble table { border-collapse: collapse; margin: 6px 0; width: 100%; font-size: 12px; }
    .bubble th, .bubble td { border: 1px solid #2c3e63; padding: 4px 6px; text-align: left; }
    .bubble th { background: rgba(255,255,255,.08); }
    .bubble blockquote { border-left: 3px solid #4ec97a; margin: 4px 0; padding: 2px 10px; background: rgba(78,201,122,.08); border-radius: 0 6px 6px 0; }
    .bubble a { color: #4ec97a; text-decoration: underline; }
    .chat-status { color: #8c95ad; font-size: 12px; margin: 0 2px 8px; }
    .chat-tip { color: #7b849c; font-size: 12px; text-align: center; padding: 16px 6px; }
 /* ---------- 询问卡（question-card） ---------- */
 .qcard { background: #1b2540; border: 1px solid #0f3460; border-radius: 14px; padding: 14px; margin: 4px 0 12px; }
 .qcard .q-title { font-size: 14px; font-weight: bold; color: #eef2fb; line-height: 1.5; margin-bottom: 10px; }
 .qcard .q-opt { display: block; width: 100%; text-align: left; padding: 11px 12px; margin-bottom: 8px; border: 1px solid #26314f; border-radius: 10px; background: #101830; color: #dbe2f2; font-size: 14px; line-height: 1.4; cursor: pointer; box-sizing: border-box; }
 .qcard .q-opt:last-child { margin-bottom: 0; }
 .qcard .q-opt .star { margin-right: 6px; }
 .qcard .q-opt.chosen { border-color: #1e8e4e; background: #122a1c; color: #cfe9d8; }
 .qcard .q-opt.chosen::after { content: ' ✓'; color: #4ec97a; font-weight: bold; }
 .qcard .q-opt:disabled { cursor: default; opacity: .55; }
 .qcard .q-opt.chosen:disabled { opacity: 1; }
    /* ---------- 底部 Tab ---------- */
    /* ---------- 设置面板 ---------- */
    .sheet {
        position: fixed; inset: 0; z-index: 40; display: none;
        background: rgba(0,0,0,.55); align-items: flex-end;
    }
    .sheet.open { display: flex; }
    .sheet-body {
        width: 100%; background: #16213e; border-radius: 16px 16px 0 0;
        padding: 16px 16px calc(18px + env(safe-area-inset-bottom, 0px));
        border-top: 1px solid #0f3460; max-height: 88vh; overflow-y: auto;
    }
    .sheet-body h2 { font-size: 16px; color: #e94560; margin-bottom: 4px; }
    .sheet-body .hint { font-size: 12px; color: #8c95ad; margin-bottom: 14px; line-height: 1.7; }
    .field { margin-bottom: 12px; }
    .field label { display: block; font-size: 12px; color: #9aa3ba; margin-bottom: 5px; }
    .field input {
        width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #26314f;
        background: #101830; color: #eee; font-size: 14px;
    }
    .btns { display: flex; gap: 10px; margin-top: 14px; }
    .btns button { flex: 1; padding: 11px 0; border: none; border-radius: 9px; font-size: 14px; font-weight: bold; }
    .btn-primary { background: #e94560; color: #fff; }
    .btn-ghost { background: #26314f; color: #cfd6e6; }
    /* ---------- Toast ---------- */
    .toast {
        position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom, 0px));
        transform: translateX(-50%); z-index: 60;
        background: #26314f; color: #fff; font-size: 13px; padding: 9px 16px;
        border-radius: 20px; opacity: 0; transition: opacity .25s; pointer-events: none;
        max-width: 86vw; text-align: center;
    }
    .toast.show { opacity: 1; }
    /* ---------- 浅色主题（跟随系统） ---------- */
    @media (prefers-color-scheme: light) {
        body { background: #f5f6fa; color: #222; }
        .header { background: #fff; border-bottom-color: #e3e6ef; }
        .brand { color: #d63a56; }
        .src-chip { background: #eef0f6; color: #5b6479; border-color: #dcdfe9; }
        .src-chip.live { background: #e6f7ec; color: #1e8e4e; border-color: #b7e3c6; }
        .src-chip.demo { background: #fdf4dd; color: #9a6b00; border-color: #ecd9a6; }
        .icon-btn { background: #eef0f6; color: #444; }
        .card { background: #fff; border-color: #e3e6ef; }
        .name { color: #1c2233; }
        .sub { color: #6b7386; }
        .pill { background: #eef0f6; color: #4a5568; }
        .prompt-line { background: #f3f5fa; color: #33405c; border-left-color: #d63a56; }
        .stat .box, .day { background: #fff; border-color: #e3e6ef; }
        .stat .k { color: #1c2233; }
        table.led td { border-top-color: #eceff5; color: #2a3244; }
        table.led td.amt { color: #c0392b; }
        .composer { background: #fff; border-top-color: #e3e6ef; }
        .composer textarea { background: #f5f6fa; color: #222; border-color: #dcdfe9; }
        .msg.assistant .bubble { background: #fff; color: #1c2233; border-color: #e3e6ef; }
        .bubble th, .bubble td { border-color: #d8dee9; }
        .bubble th { background: #f0f2f7; }
        .bubble pre { background: #f3f5fa; border-color: #dcdfe9; }
        .bubble code { background: #eef0f6; }
        .bubble blockquote { background: rgba(30,142,78,.08); }
        .msg.system .bubble { color: #6b7386; }
        .chat-status, .chat-tip { color: #6b7386; }
 .qcard { background: #fff; border-color: #e3e6ef; }
 .qcard .q-title { color: #1c2233; }
 .qcard .q-opt { background: #f5f6fa; color: #33405c; border-color: #dcdfe9; }
 .qcard .q-opt.chosen { background: #e6f7ec; color: #1e6e42; border-color: #b7e3c6; }
        .sheet-body { background: #fff; border-top-color: #e3e6ef; }
        .field input { background: #f5f6fa; color: #222; border-color: #dcdfe9; }
        .btn-ghost { background: #eef0f6; color: #444; }
    }
</style>
</head>
<body>

<header class="header">
    <span class="brand">🐱 技术喵</span>
    <span class="src-chip" id="srcChip">未连接</span>
       <span class="spacer"></span>
    <button class="icon-btn" id="refreshBtn" onclick="refresh(true)" aria-label="刷新">&#8635;</button>
    <button class="icon-btn" onclick="openSheet()" aria-label="设置">&#9881;</button>
</header>

<main class="content" id="content"></main>

<div class="composer" id="composer">
    <textarea id="chatInput" rows="1" placeholder="和技术喵说点什么…"></textarea>
    <button class="send" id="chatSend" onclick="chatSend()">发送</button>
</div>


<div class="sheet" id="sheet" onclick="closeSheet(event)">
    <div class="sheet-body" onclick="event.stopPropagation()">
        <h2>连接 GAIRR.Server</h2>
        <div class="hint">
            整页只用一个通道：一条 <code>/api/sessions/&lt;id&gt;/events</code> 事件流驱动整个页面。<br>
            直接用自然语言说话即可，主 agent 会自行判断该调用提醒/打卡/账本等哪个子功能，消息都走这条通道。<br>
            连不上就自动回落到演示数据（不报错）。
        </div>
        <div class="field">
            <label>服务器地址（默认同域 /api）</label>
            <input type="text" id="fBase" placeholder="/api" autocapitalize="off" autocorrect="off" spellcheck="false" autocomplete="off">
        </div>
        <div class="field">
            <label>Token（与手机端会话页共用，存本机）</label>
            <input type="text" id="fToken" placeholder="访问令牌" autocapitalize="off" autocorrect="off" spellcheck="false" autocomplete="off">
        </div>
        <div class="field">
            <label>项目路径</label>
            <input type="text" id="fProject" placeholder="d:\work\gairr">
        </div>
        <div class="btns">
            <button class="btn-primary" onclick="saveSheet()">保存并连接</button>
            <button class="btn-ghost" onclick="closeSheet()">取消</button>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
    'use strict';

    /* ============ 状态 ============ */
    var LS_BASE = 'cat_base', LS_PROJ = 'cat_project', LS_TOKEN = 'gairr_token';
    var isFile = location.protocol === 'file:';
    var state = {
        base: localStorage.getItem(LS_BASE) || (isFile ? 'http://app.gairr.com/api' : '/api'),
        project: localStorage.getItem(LS_PROJ) || 'd:\\work\\gairr',
        token: localStorage.getItem(LS_TOKEN) || '',
               src: 'off',       // off | live | demo
        msg: '',
        sessionId: '',
        tasks: [],
        role: 'reminder-cat',   // 主 agent 角色（喵喵）
        busy: false,
        chat: {           // 聊天（真连服务端，与提醒页共用 state.sessionId 会话）
            msgs: [],     // 已定稿消息 {role:user|assistant|system, text}
            live: '',     // 正在流式输出的文本（打字机）
            target: '',   // 流式目标全文
            status: '',   // 思考/工具提示
            armed: false, // 是否在等本次发送的回复
            discard: false, // 保留位：服务端已按轮裁剪回放，正常不再丢帧
            busy: false,  // 猫是否在回复
            pendingDanger: null, // 待确认的危险命令卡
 pendingQuestion: null, // 待回答的询问卡 {question, options, selected}
            session: '',  // 已加载历史对应的会话
            es: null,     // 事件流句柄（AbortController）
            typer: 0      // 打字机定时器
        }
    };
    var seq = 0;

    /* ============ 工具 ============ */
    function pad(n) { return (n < 10 ? '0' : '') + n; }
    function ymd(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
    function todayYmd() { return ymd(new Date()); }
    function shiftYmd(n) { var d = new Date(); d.setDate(d.getDate() + n); return ymd(d); }
    function money(v) { return (Math.round(v * 100) / 100).toFixed(2); }
    function el(tag, cls, text) {
        var e = document.createElement(tag);
        if (cls) e.className = cls;
        if (text !== undefined && text !== null) e.textContent = text;
        return e;
    }
    function hhmm(dt) { return pad(dt.getHours()) + ':' + pad(dt.getMinutes()); }
    function toast(msg) {
        var t = document.getElementById('toast');
        t.textContent = msg; t.classList.add('show');
        clearTimeout(t._tm); t._tm = setTimeout(function () { t.classList.remove('show'); }, 1800);
    }
    /* XHR 封装：超时 8s，回调 (status, text)；status=0 表示网络/超时错误 */
    function req(method, url, cb) {
        var xhr = new XMLHttpRequest();
        try { xhr.open(method, url, true); } catch (e) { cb(0, 'bad url'); return; }
        xhr.timeout = 8000;
        if (state.token) xhr.setRequestHeader('Authorization', 'Bearer ' + state.token);
        xhr.onreadystatechange = function () { if (xhr.readyState === 4) cb(xhr.status, xhr.responseText); };
        xhr.ontimeout = function () { cb(0, 'timeout'); };
        xhr.onerror = function () { cb(0, 'network error'); };
        try { xhr.send(null); } catch (e) { cb(0, 'send failed'); }
    }
    function api(path) { return state.base.replace(/\/+$/, '') + path; }
    function jparse(text, fallback) { try { return JSON.parse(text); } catch (e) { return fallback; } }

    /* ============ 真实数据链路：health → sessions → tasks ============ */
    function refresh(manual) {
        var my = ++seq;
        state.busy = true;
        if (manual) { var b = document.getElementById('refreshBtn'); b.classList.add('spin'); setTimeout(function () { b.classList.remove('spin'); }, 900); }
        req('GET', api('/health'), function (st, txt) {
            if (my !== seq) return;
            if (st !== 200) return fail(st, my);
            var rows = null;
            req('GET', api('/sessions?project=' + encodeURIComponent(state.project)), function (st2, txt2) {
                if (my !== seq) return;
                if (st2 === 200) {
                    var data = jparse(txt2, null);
                    rows = data && data.sessions ? data.sessions : (Object.prototype.toString.call(data) === '[object Array]' ? data : null);
                } else {   // 会话列表异常（如 401 令牌无效）：不能吞成"没有可用会话"，否则看不出是鉴权问题
                    state.src = 'live'; state.busy = false; state.sessionId = '';
                    state.tasks = [];
                    state.msg = st2 === 401
                        ? '鉴权失败：Token 无效（当前填的是“' + (state.token || '空') + '”，请到 ⚙ 重填，注意手机可能自动把首字母变大写）'
                        : '会话列表读取失败（HTTP ' + st2 + '）';
                    render(); return;
                }
                var sid = pickSession(rows);
                if (!sid) {
                    state.src = 'live'; state.busy = false; state.sessionId = '';
                    state.tasks = []; state.msg = '没有可用会话'; render(); return;
                }
                loadTasks(sid, my, 0);
            });
        });
    }
    function fail(st, my) {
        state.src = 'demo'; state.busy = false;
        state.msg = st === 0 ? '连不上 GAIRR.Server（本机未启动 / 隧道未生效）' : '鉴权或接口异常（HTTP ' + st + '），检查 Token';
        state.tasks = [];
        render();
    }
    /* 选读任务的会话：手机端会话优先，其次活跃/最近更新（Server 任务接口需 hub 内会话，找不到会先 resume 再试） */
    function pickSession(rows) {
        if (!rows || !rows.length) return '';
        var score = function (r) {
            var s = 0;
            if (String(r.category || '') === 'mobile') s += 4;
            if (r.busy) s += 2;
            if (r.active) s += 1;
            return s;
        };
        var list = rows.slice(0).sort(function (a, b) {
            var d = score(b) - score(a);
            if (d !== 0) return d;

            ch.retries = (ch.retries || 0) + 1;
            if (ch.retries <= 3) {
                ch.status = '连接中断，正在重连（' + ch.retries + '/3）…';
                ch.lastEv = Date.now();
                render();
                clearTimeout(ch.watchdog);
                ch.watchdog = setTimeout(function () {   // 重连后 10 秒仍无事件：视为本轮已结束，兜底同步历史
                    if (state.chat !== ch || (!ch.armed && !ch.watch)) return;
                    if (Date.now() - ch.lastEv < 9500) return;
                    var wasWatch = !!ch.watch && !ch.armed;
                    ch.armed = false; ch.watch = false; ch.busy = false; ch.retries = 0;
                    ch.status = '事件流已断开，重新发送即可继续';
                    render();
                    chatLoadHistory();
                    if (wasWatch) chatPush('system', '上一个任务可能已完成，你刚才的消息未发出，刷新确认后再重发喵');
                }, 10000);
                setTimeout(function () { if (state.chat === ch && (ch.armed || ch.watch) && !ch.es) chatOpenStream(); }, 600);
                return;
            }
            var wasWatch2 = !!ch.watch && !ch.armed;
            ch.armed = false; ch.watch = false; ch.busy = false; ch.retries = 0;
            clearTimeout(ch.watchdog); ch.watchdog = 0;
            ch.status = '事件流已断开，重新发送即可继续';
            render();
            chatLoadHistory();   // 任务可能其实已完成：拉服务端历史兜底显示回复
            if (wasWatch2) chatPush('system', '上一个任务可能已完成，你刚才的消息未发出，刷新确认后再重发喵');
            return;
        }
        ch.retries = 0;
        clearTimeout(ch.watchdog); ch.watchdog = 0;
    }

    function chatSend() {
        var ta = document.getElementById('chatInput');
        if (!ta) return;
        var text = (ta.value || '').trim();
        if (!text) return;
        if (state.src !== 'live' || !state.sessionId) { toast('还没有可用会话'); return; }
        if (state.chat.busy || state.chat.watch) { toast('猫还在回复，等一下喵'); return; }
        var ch = state.chat;
        chatPush('user', text);
        ta.value = ''; ta.style.height = '38px';
        ch.busy = true; ch.watch = false; ch.status = '猫正在思考…'; ch.armed = true; ch.discard = false;
        ch.retries = 0; clearTimeout(ch.watchdog); ch.watchdog = 0;
        render();
        chatPost(text, 0);   // 发送成功后再连事件流收回复（服务端只回放本轮帧，无需再丢）
    }

    function chatPost(text, retried) {
        var ch = state.chat;
        reqJson('POST', api('/sessions/' + encodeURIComponent(state.sessionId) + '/messages'), { text: text }, function (st, txt) {
            if (st === 404 && !retried) {   // 会话不在 hub：先 resume 再重试
                reqJson('POST', api('/sessions/' + encodeURIComponent(state.sessionId) + '/resume?project=' + encodeURIComponent(state.project)), null, function () {
                    chatPost(text, 1);
                });
                return;
            }
            if (st === 200 || st === 202) { ch.watch = false; chatOpenStream(); return; }   // 连流收流式回复
            if (st === 409) {   // 上个任务还在跑：不做死胡同，挂事件流实时围观到完成，再提醒重发
                ch.armed = false; ch.busy = false; ch.watch = true;
                ch.status = '猫还在执行上一个任务，实时帮你盯着，完成后提醒你重发…';
                chatPush('system', '这条消息还没发出去（上个任务进行中），已帮你盯着，完成后请重发');
                render();
                chatOpenStream();
                return;
            }
            ch.armed = false; ch.watch = false; ch.discard = false; ch.busy = false; ch.status = '';
            var e = jparse(txt, {}) || {};
            chatPush('system', '发送失败（HTTP ' + st + '）' + (e.error ? '：' + e.error : ''));
            render(); toast('发送失败');
        });
    }

    function chatDecide(allow) {
        var ch = state.chat;
        reqJson('POST', api('/sessions/' + encodeURIComponent(state.sessionId) + '/decisions'), { type: 'danger', allow: allow }, function (st) {
            if (st === 200) {
                ch.pendingDanger = null;
                chatPush('system', allow ? '已允许执行' : '已拒绝');
                render();
            } else { toast('提交失败（HTTP ' + st + '）'); }
        });
    }

 // 回答询问卡：把选中项文本作为一条用户消息发出，并把卡片标记为已选
 function chatAnswerQuestion(oIdx) {
 var ch = state.chat;
 var q = ch.pendingQuestion;
 if (!q) return;
 var opt = (q.options || [])[oIdx];
 if (!opt) return;
 if (state.src !== 'live' || !state.sessionId) { toast('还没有可用会话'); return; }
 if (ch.busy || ch.watch) { toast('猫还在回复，等一下喵'); return; }
 q.selected = oIdx;
 var text = (typeof opt === 'string') ? opt : (opt.text || '');
 chatPush('user', text);
 ch.busy = true; ch.watch = false; ch.status = '猫正在思考…'; ch.armed = true; ch.discard = false;
 ch.retries = 0; clearTimeout(ch.watchdog); ch.watchdog = 0;
 render();
 chatPost(text, 0);
 }

 function chatCreate() {
 toast('正在新建会话…');
        reqJson('POST', api('/sessions'), { project: state.project }, function (st, txt) {
            var d = jparse(txt, {}) || {};
            if ((st === 200 || st === 201) && d.sessionId) {
                state.src = 'live'; state.sessionId = d.sessionId;
                state.chat.session = '';   // 触发 renderChat 重新拉历史
 render();
 toast('会话已创建，开始聊吧');
            } else {
                toast('新建失败：' + (d.error || ('HTTP ' + st)));
            }
        });
    }

    window.chatSend = chatSend;
    window.chatCreate = chatCreate;
    (function initComposer() {
        var ta = document.getElementById('chatInput');
        if (!ta) return;
        ta.addEventListener('keydown', function (e) {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); chatSend(); }
        });
        ta.addEventListener('input', function () {
            ta.style.height = '38px';
            ta.style.height = Math.min(100, ta.scrollHeight) + 'px';
        });
    })();

 /* ============ 设置面板 ============ */
    window.refresh = function (manual) { refresh(manual); };
    window.openSheet = function () {
        document.getElementById('fBase').value = state.base;
        document.getElementById('fToken').value = state.token;
        document.getElementById('fProject').value = state.project;
        document.getElementById('sheet').classList.add('open');
    };
    window.closeSheet = function (ev) {
        if (ev && ev.target !== document.getElementById('sheet')) return;
        document.getElementById('sheet').classList.remove('open');
    };
    window.saveSheet = function () {
        state.base = (document.getElementById('fBase').value || '').trim() || '/api';
        state.token = document.getElementById('fToken').value.trim();
        state.project = document.getElementById('fProject').value.trim() || 'd:\\work\\gairr';
        try {
            localStorage.setItem(LS_BASE, state.base);
            localStorage.setItem(LS_PROJ, state.project);
            localStorage.setItem(LS_TOKEN, state.token);
        } catch (e) {}
        document.getElementById('sheet').classList.remove('open');
        state.src = 'off'; render();
        refresh(false);
        toast('已保存，正在连接…');
    };

    /* ============ 启动：先渲染（保证离线也能看），再拉真实数据 ============ */
    render();
    refresh(false);
})();
</script>
</body>
</html>
