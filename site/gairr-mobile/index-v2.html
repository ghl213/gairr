<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>GAIRR Mobile</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e; color: #eee; height: 100vh; display: flex; flex-direction: column;
        }
        .header {
            padding: 12px 16px; background: #16213e; border-bottom: 1px solid #0f3460;
            display: flex; align-items: center; justify-content: space-between;
        }
        .header h1 { font-size: 18px; color: #e94560; }
        .status { display: flex; align-items: center; gap: 6px; font-size: 12px; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #666; }
        .status-dot.connected { background: #00d9ff; box-shadow: 0 0 8px #00d9ff; }
        .status-dot.connecting { background: #ffd700; animation: pulse 1s infinite; }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
        .config-btn { background: none; border: 1px solid #e94560; color: #e94560; padding: 4px 12px; border-radius: 4px; font-size: 12px; }
        .chat-container { flex: 1; overflow-y: auto; padding: 16px; }
        .message { margin-bottom: 12px; padding: 10px 14px; border-radius: 12px; max-width: 85%; word-wrap: break-word; font-size: 14px; line-height: 1.5; }
        .message.user { background: #e94560; margin-left: auto; }
        .message.assistant { background: #16213e; border: 1px solid #0f3460; }
        .message.system { background: #0f3460; font-size: 12px; color: #aaa; text-align: center; max-width: 100%; }
        .input-area { padding: 12px 16px; background: #16213e; border-top: 1px solid #0f3460; display: flex; gap: 8px; }
        .input-area input { flex: 1; padding: 10px 14px; border: 1px solid #0f3460; border-radius: 20px; background: #1a1a2e; color: #eee; font-size: 14px; }
        .input-area button { padding: 10px 20px; background: #e94560; color: white; border: none; border-radius: 20px; font-size: 14px; }
        .config-panel { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); z-index: 100; }
        .config-panel.open { display: flex; align-items: center; justify-content: center; }
        .config-content { background: #16213e; padding: 24px; border-radius: 12px; width: 90%; max-width: 400px; }
        .config-content h2 { margin-bottom: 16px; color: #e94560; }
        .config-row { margin-bottom: 12px; }
        .config-row label { display: block; font-size: 12px; color: #aaa; margin-bottom: 4px; }
        .config-row input { width: 100%; padding: 10px; border: 1px solid #0f3460; border-radius: 6px; background: #1a1a2e; color: #eee; font-size: 14px; }
        .config-actions { display: flex; gap: 8px; margin-top: 16px; }
        .config-actions button { flex: 1; padding: 10px; border: none; border-radius: 6px; font-size: 14px; }
        .btn-primary { background: #e94560; color: white; }
        .btn-secondary { background: #0f3460; color: #eee; }
    </style>
</head>
<body>
    <div class="header">
        <h1>GAIRR</h1>
        <div class="status">
            <span class="status-dot" id="statusDot"></span>
            <span id="statusText">未连接</span>
        </div>
        <button class="config-btn" onclick="toggleConfig()">配置</button>
    </div>
    <div class="chat-container" id="chatContainer"></div>
    <div class="input-area">
        <input type="text" id="messageInput" placeholder="输入消息..." disabled>
        <button id="sendBtn" onclick="sendMessage()" disabled>发送</button>
    </div>
    <div class="config-panel" id="configPanel">
        <div class="config-content">
            <h2>连接配置</h2>
            <div class="config-row">
                <label>服务器地址</label>
                <input type="text" id="serverUrl" value="http://8.136.112.142/api">
            </div>
            <div class="config-row">
                <label>Token</label>
                <input type="text" id="token" value="gairr-mobile-token-2024">
            </div>
            <div class="config-row">
                <label>项目路径</label>
                <input type="text" id="projectPath" value="d:\\work\\gairr">
            </div>
            <div class="config-actions">
                <button class="btn-primary" onclick="connect()">连接</button>
                <button class="btn-secondary" onclick="toggleConfig()">取消</button>
            </div>
        </div>
    </div>
    <script>
        var state = {
            serverUrl: 'http://8.136.112.142/api',
            token: 'gairr-mobile-token-2024',
            projectPath: 'd:\\\\work\\\\gairr',
            sessionId: null,
            isConnected: false,
            isBusy: false,
            lastContent: '',  // 用于过滤重复内容
            currentReplyDiv: null  // 当前回复卡片
        };
        function toggleConfig() {
            document.getElementById('configPanel').classList.toggle('open');
        }
        function setStatus(status, text) {
            var dot = document.getElementById('statusDot');
            var txt = document.getElementById('statusText');
            dot.className = 'status-dot ' + status;
            txt.textContent = text;
        }
        function addMessage(text, type) {
            var container = document.getElementById('chatContainer');
            var div = document.createElement('div');
            div.className = 'message ' + type;
            div.textContent = text;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
            return div;
        }
        function updateOrCreateReply(text) {
            // 过滤重复内容
            if (text === state.lastContent) return;
            state.lastContent = text;
            
            var container = document.getElementById('chatContainer');
            if (state.currentReplyDiv) {
                // 更新现有卡片
                state.currentReplyDiv.textContent = text;
            } else {
                // 创建新卡片
                state.currentReplyDiv = document.createElement('div');
                state.currentReplyDiv.className = 'message assistant';
                state.currentReplyDiv.textContent = text;
                container.appendChild(state.currentReplyDiv);
            }
            container.scrollTop = container.scrollHeight;
        }
        function finishReply() {
            state.currentReplyDiv = null;
            state.lastContent = '';
        }
        function setInputEnabled(enabled) {
            document.getElementById('messageInput').disabled = !enabled;
            document.getElementById('sendBtn').disabled = !enabled;
        }
        function httpRequest(method, url, headers, body, callback) {
            var xhr = new XMLHttpRequest();
            xhr.open(method, url, true);
            for (var key in headers) {
                xhr.setRequestHeader(key, headers[key]);
            }
            xhr.onreadystatechange = function() {
                if (xhr.readyState == 4) {
                    callback(xhr.status, xhr.responseText);
                }
            };
            xhr.onerror = function() {
                callback(0, 'Network error');
            };
            xhr.send(body || null);
        }
        function connect() {
            state.serverUrl = document.getElementById('serverUrl').value.trim();
            state.token = document.getElementById('token').value.trim();
            state.projectPath = document.getElementById('projectPath').value.trim();
            if (!state.serverUrl || !state.token) {
                addMessage('请填写服务器地址和 Token', 'system');
                return;
            }
            setStatus('connecting', '连接中...');
            httpRequest('GET', state.serverUrl + '/health', {
                'Authorization': 'Bearer ' + state.token
            }, null, function(status, response) {
                if (status == 200 || status == 201) {
                    var data = JSON.parse(response);
                    addMessage('服务器连接成功 (' + data.sessions + ' 个活跃会话)', 'system');
                    createSession();
                } else {
                    setStatus('', '连接失败');
                    addMessage('连接失败: HTTP ' + status, 'system');
                }
            });
        }
        function createSession() {
            httpRequest('POST', state.serverUrl + '/sessions', {
                'Authorization': 'Bearer ' + state.token,
                'Content-Type': 'application/json'
            }, JSON.stringify({project: state.projectPath}), function(status, response) {
                if (status == 200 || status == 201) {
                    var data = JSON.parse(response);
                    state.sessionId = data.sessionId;
                    state.isConnected = true;
                    setStatus('connected', '已连接');
                    setInputEnabled(true);
                    toggleConfig();
                    addMessage('会话已创建: ' + state.sessionId, 'system');
                    connectSSE();
                } else {
                    addMessage('创建会话失败: HTTP ' + status, 'system');
                }
            });
        }
        function connectSSE() {
            var url = state.serverUrl + '/sessions/' + state.sessionId + '/events';
            var xhr = new XMLHttpRequest();
            xhr.open('GET', url, true);
            xhr.setRequestHeader('Authorization', 'Bearer ' + state.token);
            xhr.onprogress = function() {
                var lines = xhr.responseText.split('\n');
                for (var i = 0; i < lines.length; i++) {
                    var line = lines[i].trim();
                    if (line.indexOf('data: ') === 0) {
                        try {
                            var event = JSON.parse(line.substring(6));
                            handleEvent(event);
                        } catch(e) {}
                    }
                }
            };
            xhr.onerror = function() {
                addMessage('SSE 连接错误', 'system');
            };
            xhr.send();
        }
        function handleEvent(event) {
            var type = event.type || event.Type;
            var content = event.content || event.text || event.Delta || event.Reasoning || event.LogLine;
            
            if (type === 'Summary') {
                // 初始总结，不显示
            } else if (type === 'StreamDelta') {
                // 流式回复内容 - 更新到同一个卡片
                if (event.Delta) updateOrCreateReply(event.Delta);
            } else if (type === 'Round') {
                // 完整回复 - 更新到同一个卡片
                if (event.Reasoning) updateOrCreateReply(event.Reasoning);
            } else if (type === 'text' || type === 'message') {
                if (content) updateOrCreateReply(content);
            } else if (type === 'thinking' || type === 'ThinkingLive') {
                // 思考中，不显示过程
            } else if (type === 'tool_call' || type === 'ToolCall') {
                // 工具调用，不显示过程
            } else if (type === 'Finished' || type === 'finished') {
                state.isBusy = false;
                setInputEnabled(true);
                finishReply();
                addMessage('任务完成', 'system');
            } else if (type === 'Failed' || type === 'failed') {
                state.isBusy = false;
                setInputEnabled(true);
                finishReply();
                addMessage('任务失败', 'system');
            }
            // Log 类型不显示，避免刷屏
        }
        function sendMessage() {
            var input = document.getElementById('messageInput');
            var text = input.value.trim();
            if (!text || state.isBusy) return;
            addMessage(text, 'user');
            input.value = '';
            state.isBusy = true;
            setInputEnabled(false);
            httpRequest('POST', state.serverUrl + '/sessions/' + state.sessionId + '/messages', {
                'Authorization': 'Bearer ' + state.token,
                'Content-Type': 'application/json'
            }, JSON.stringify({text: text}), function(status, response) {
                state.isBusy = false;
                setInputEnabled(true);
                if (status == 200 || status == 201 || status == 202) {
                    addMessage('消息已发送', 'system');
                } else {
                    addMessage('发送失败: HTTP ' + status, 'system');
                }
            });
        }
        document.getElementById('messageInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
