# frpc 客户端配置
# 放置位置: 工作电脑 (Windows)
# 配合: frp_0.58.1_windows_amd64

serverAddr = "8.136.112.142"
serverPort = 7000
auth.token = "gairr-frp-token-2024"

# 日志
log.to = "frpc.log"
log.level = "info"
log.maxDays = 7

# Web 管理面板 (本地查看)
webServer.addr = "127.0.0.1"
webServer.port = 7400

# === GAIRR Server 穿透 ===
[[proxies]]
name = "gairr-api"
type = "tcp"
localIP = "127.0.0.1"
localPort = 8123
remotePort = 8123

# 健康检查 (可选)
healthCheck.type = "tcp"
healthCheck.intervalSeconds = 10
