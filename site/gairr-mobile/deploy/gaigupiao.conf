# ==========================================
# GaiStock - gaiit.com
# ==========================================
server {
    listen 80;
    server_name gaiit.com www.gaiit.com;

    location / {
        root /opt/gaigupiao/frontend;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location /h2-console/ {
        proxy_pass http://127.0.0.1:8080/h2-console/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

# ==========================================
# 闳善轩 - gairr.com (default server, includes /app/ for PWA)
# ==========================================
server {
    listen 80 default_server;
    server_name gairr.com www.gairr.com 8.136.112.142 _;

    location / {
        root /opt/hongshanxuan;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # GAIRR Mobile PWA
    location = /app {
        return 302 /app/;
    }

    location /app/ {
        alias /var/www/gairr-mobile/;
        index index.html;
        try_files $uri $uri/ =404;
    }
}
