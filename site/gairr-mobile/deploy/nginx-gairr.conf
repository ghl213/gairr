server {
    listen 80;
    server_name _;
    
    # 官网根目录
    root /var/www/html;
    index index.html;
    
    # PWA 应用路径
    location /app/ {
        alias /var/www/gairr-mobile/;
        index index-v3.html;
        try_files $uri $uri/ /app/index-v3.html;
        
        # 缓存静态资源
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|json)$ {
            expires 1d;
            add_header Cache-Control "public, immutable";
        }
    }
    
    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
}
